<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタッフ一覧</title>
<!-- 守り：このページが通信できる先を Google Apps Script だけに絞る(万一、文字が混入しても外へ送れないように)。URLを他サイトに渡さない -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<!--
  スタッフ一覧(社員以上)：GitHub Pages の staff/index.html。ポータルと同じサイト
  ・スタッフ名簿(StaffMaster)から、氏名・雇用区分・所属・メール・ステータス・グレード・オンボーディング(準備：の列)の状況を表示
  ・データは認証基盤から受け取る(ツール一覧の staff の行の API＝認証基盤のURL)。通行証の staff の権限が必要
  通行証とデータの入口は、ポータルがブラウザの中に置いたものを使う。秘密は置かない
-->
<link rel="stylesheet" href="../common/style.css?v=1">
<style>
  /* スタッフ一覧だけの見た目(共通の見た目は ../common/style.css) */
  :root { --c: var(--p-c); --soft: var(--p-soft); --ink: var(--p-ink); --muted: var(--p-muted); --line: var(--p-line); --bg: var(--p-bg); --err: var(--p-err); --ok: var(--p-ok); } /* 前の版の色の名前 → 共通の色 */
  .wrap { max-width: 1100px; margin: 0 auto; padding: 12px 14px 40px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  input[type=search], select { font-size: 15px; padding: 8px 10px; border: 1px solid #B9C0C8; border-radius: 8px; background: #fff; font-family: inherit; }
  input[type=search] { min-width: 180px; }
  label.ck { font-size: 13px; color: var(--muted); }
  .count { font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .tbl { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #EEF1F4; text-align: left; white-space: nowrap; vertical-align: top; }
  th { color: var(--muted); font-weight: 400; font-size: 12px; background: #FAFBFC; position: sticky; top: 0; cursor: pointer; }
  td.nm { font-weight: 700; }
  td.mail a { color: #1A73E8; text-decoration: none; }
  .st { font-size: 12px; border-radius: 999px; padding: 1px 8px; }
  .st.on { background: #E6F4EC; color: var(--ok); }
  .st.off { background: #EEF1F4; color: var(--muted); }
  .bar { display: inline-block; width: 60px; height: 8px; background: #EEF1F4; border-radius: 4px; vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .todo { font-size: 12px; color: #B4581F; white-space: normal; max-width: 260px; }
  .done { font-size: 12px; color: var(--ok); }
</style>
</head>
<body>
<div id="app" hidden>
  <div class="p-wrap p-wide">
    <div class="tools">
      <input type="search" id="q" placeholder="名前・メールで探す">
      <select id="fAffil"></select>
      <select id="fEmp"></select>
      <label class="ck"><input type="checkbox" id="fAll"> 休職・退職も表示</label>
      <label class="ck"><input type="checkbox" id="fTodo"> 準備が終わっていない人だけ</label>
    </div>
    <div class="count" id="count"></div>
    <div class="tbl"><table id="tbl"></table></div>
    <div class="p-ver" id="ver"></div>
  </div>
</div>

<script src="../common/portal.js?v=1"></script>
<script>
var PAGE_VERSION = '2026-10-19a';
var g = Portal.$, esc = Portal.esc;
var D = null, SORT = { k: 'sid', asc: true };

function opts(list, label) { return '<option value="">' + label + '(すべて)</option>' + list.map(function (v) { return '<option>' + esc(v) + '</option>'; }).join(''); }
function prepDone(x) { return D.prepKeys.filter(function (k) { return x.prep[k]; }).length; }

function render() {
  var q = g('q').value.trim().toLowerCase(), fa = g('fAffil').value, fe = g('fEmp').value;
  var list = D.staff.filter(function (x) {
    if (!g('fAll').checked && x.status !== '在籍') return false;
    if (fa && x.affilLabel.split('・').indexOf(fa) === -1) return false;
    if (fe && x.emp !== fe) return false;
    if (g('fTodo').checked && prepDone(x) === D.prepKeys.length) return false;
    if (q && (x.name + ' ' + x.mail).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  var key = function (x) { return SORT.k === 'prep' ? prepDone(x) : String(x[SORT.k] || ''); };
  list.sort(function (a, b) { var A = key(a), B = key(b); return (A < B ? -1 : A > B ? 1 : 0) * (SORT.asc ? 1 : -1); });
  var cols = [['sid', 'StaffID'], ['name', '氏名'], ['emp', '雇用区分'], ['affilLabel', '所属'], ['mail', 'メール'], ['status', 'ステータス'], ['grade', 'グレード']];
  if (D.prepKeys.length) cols.push(['prep', 'オンボーディング']);
  var h = '<tr>' + cols.map(function (c) { return '<th data-k="' + c[0] + '">' + c[1] + (SORT.k === c[0] ? (SORT.asc ? ' ▲' : ' ▼') : '') + '</th>'; }).join('') + '</tr>';
  list.forEach(function (x) {
    var n = prepDone(x), total = D.prepKeys.length;
    var todo = D.prepKeys.filter(function (k) { return !x.prep[k]; }).map(function (k) { return k.replace(/^準備：/, ''); });
    h += '<tr><td>' + esc(x.sid) + '</td><td class="nm">' + esc(x.name) + '</td><td>' + esc(x.emp) + '</td><td>' + esc(x.affilLabel) + '</td>' +
      '<td class="mail">' + (x.mail ? '<a href="mailto:' + esc(x.mail) + '">' + esc(x.mail) + '</a>' : '') + '</td>' +
      '<td><span class="st ' + (x.status === '在籍' ? 'on' : 'off') + '">' + esc(x.status) + '</span></td><td>' + esc(x.grade) + '</td>' +
      (total ? '<td><span class="bar"><i style="width:' + Math.round(n / total * 100) + '%"></i></span>' + n + '/' + total +
        (todo.length ? '<div class="todo">未：' + esc(todo.join('、')) + '</div>' : '<div class="done">すべて完了</div>') + '</td>' : '') + '</tr>';
  });
  g('tbl').innerHTML = h;
  g('count').textContent = list.length + '人' + (g('fAll').checked ? '' : '(在籍)');
}

function show(res) {
  D = res;
  Portal.showApp();
  var affils = [], emps = [];
  D.staff.forEach(function (x) {
    x.affilLabel.split('・').forEach(function (a) { if (a && affils.indexOf(a) === -1) affils.push(a); });
    if (x.emp && emps.indexOf(x.emp) === -1) emps.push(x.emp);
  });
  g('fAffil').innerHTML = opts(affils, '所属');
  g('fEmp').innerHTML = opts(emps, '雇用区分');
  g('ver').textContent = Portal.timing(PAGE_VERSION) + (D.prepCols.length ? '・オンボーディングの項目：' + D.prepCols.join('、') : '');
  render();
}

['q', 'fAffil', 'fEmp', 'fAll', 'fTodo'].forEach(function (id) { g(id).addEventListener(id === 'q' ? 'input' : 'change', render); });
g('tbl').addEventListener('click', function (e) {
  var th = e.target.closest('th[data-k]'); if (!th) return;
  var k = th.getAttribute('data-k');
  SORT = { k: k, asc: SORT.k === k ? !SORT.asc : true };
  render();
});

// 通行証の確認とヘッダーは共通部品(Portal.start)。データは認証基盤から(app なし)
var P = Portal.start({ tool: 'staff', title: 'スタッフ一覧' });
if (P) {
  P.call('staff.list', {}, { retry: true }).then(function (res) {
    if (!res.ok) { Portal.gate(Portal.authMessage(res, 'スタッフ一覧'), { back: true }); return; }
    show(res);
  }).catch(function (e) { Portal.gate('通信に失敗しました。\n開き直してください。', { back: true, detail: e.message }); });
}
</script>
</body>
</html>
