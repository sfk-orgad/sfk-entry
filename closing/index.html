<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>締めチェック</title>
<meta charset="UTF-8">
<style>
  :root { --c: #16323A; --c-soft: #E8EEF0; --ink: #1F2328; --muted: #5F6670; --line: #D5DAE0; --bg: #F5F6F8; --err: #B42318; --warn: #B54708; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 18px; line-height: 1.6; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 14px 120px; }
  header { background: var(--c); color: #fff; padding: 10px 18px 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; min-height: 28px; font-size: 14px; }
  .topbar a { color: #fff; text-decoration: none; opacity: .9; padding: 4px 0; }
  .topbar .me { opacity: .9; }
  header .store { font-size: 15px; opacity: .85; }
  header h1 { font-size: 26px; margin: 2px 0 0; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px; margin-top: 16px; }
  .card.missing { border: 2px solid var(--err); }
  .card-title { font-size: 20px; font-weight: 700; margin: 0 0 14px; }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field > label { display: block; font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-left: 8px; vertical-align: 2px; background: #FDECEA; color: var(--err); }
  select, input[type=text], textarea { width: 100%; font-size: 18px; padding: 14px 12px; border: 1px solid #B9C0C8; border-radius: 10px; background: #fff; color: var(--ink); font-family: inherit; }
  textarea { min-height: 110px; resize: vertical; }
  .num { display: flex; align-items: center; gap: 10px; }
  .num input { flex: 1; text-align: right; }
  .num .unit { font-size: 18px; color: var(--muted); min-width: 2em; }
  .note { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .note.warn { color: var(--warn); font-weight: 700; }
  .check { display: flex; align-items: center; gap: 14px; padding: 15px 14px; border: 1px solid #C9CFD6; border-radius: 12px; cursor: pointer; user-select: none; margin-bottom: 10px; font-size: 18px; }
  .check:last-child { margin-bottom: 0; }
  .check .box { width: 30px; height: 30px; border: 2px solid #9AA3AD; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
  .check.on { border-color: var(--c); background: var(--c-soft); font-weight: 700; }
  .check.on .box { background: var(--c); border-color: var(--c); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { font-size: 18px; padding: 12px 18px; border: 1px solid #B9C0C8; border-radius: 999px; background: #fff; cursor: pointer; color: var(--ink); font-family: inherit; }
  .chip.on { background: var(--c); border-color: var(--c); color: #fff; font-weight: 700; }
  .dayinfo { margin-top: 12px; padding: 14px; border-radius: 10px; background: var(--c-soft); font-size: 17px; }
  .dayinfo .price { font-size: 20px; font-weight: 700; }
  .dayinfo .topic { margin-top: 8px; white-space: pre-wrap; }
  .dayinfo .done { margin-top: 8px; color: var(--warn); font-weight: 700; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
  .bar .inner { max-width: 560px; margin: 0 auto; }
  .progress { font-size: 15px; color: var(--muted); text-align: center; margin-bottom: 8px; }
  .submit { width: 100%; padding: 18px; font-size: 20px; font-weight: 700; color: #fff; background: var(--c); border: none; border-radius: 12px; cursor: pointer; font-family: inherit; }
  .submit:disabled { opacity: .5; }
  #error { color: var(--err); font-size: 16px; font-weight: 700; margin-top: 12px; text-align: center; white-space: pre-wrap; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,.95); z-index: 50; align-items: center; justify-content: center; flex-direction: column; font-size: 18px; }
  .spinner { width: 44px; height: 44px; border: 5px solid var(--c-soft); border-top-color: var(--c); border-radius: 50%; animation: spin .9s linear infinite; margin-bottom: 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #done { display: none; text-align: center; padding: 64px 20px; }
  .gspin { width: 40px; height: 40px; margin: 0 auto 16px; border: 5px solid #E8EEF0; border-top-color: #16323A; border-radius: 50%; animation: spin .9s linear infinite; }
  .gbtn { display: inline-block; padding: 14px 22px; border-radius: 12px; background: #16323A; color: #fff; text-decoration: none; font-weight: 700; }
  #done h2 { font-size: 26px; margin: 0 0 12px; color: var(--c); }
  #done p { font-size: 18px; margin: 0 0 8px; }
</style>
</head>
<body>
<!--
  締めチェックの画面(GitHub Pages の closing/index.html。ポータルと同じサイト)
  開き方：ポータルのカードから(closing/?store=店舗コード)
  通行証とデータの入口(BotのGASのURL)は、ポータルがブラウザの中(sessionStorage)に置いたものを使う。このファイルには秘密を置かない
-->
<div id="gate" style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;">
  <div><div class="gspin" id="gspin"></div><div id="gmsg" style="font-size:18px;line-height:1.7;white-space:pre-wrap;">準備しています…</div>
  <div id="gact" style="margin-top:18px;"></div>
  <div id="gdetail" style="font-size:12px;color:#5F6670;margin-top:14px;word-break:break-all;text-align:left;"></div>
  <div id="gver" style="font-size:11px;color:#9AA3AD;margin-top:16px;"></div></div>
</div>
<div id="app" style="display:none">

<header><div class="topbar"><a id="back" href="#" style="visibility:hidden">‹ ポータル</a><span class="me" id="me"></span></div><div class="wrap" style="padding-bottom:0;">
  <div class="store" id="storeName"></div>
  <h1>締めチェック</h1>
</div></header>
<div id="timing" style="text-align:center;font-size:11px;color:#9AA3AD;margin:6px 0 0;"></div>

<div class="wrap" id="main">
  <div class="card" id="card-basic">
    <div class="card-title">基本情報</div>
    <div class="field">
      <label for="date">営業日</label>
      <select id="date"></select>
    </div>
    <div class="dayinfo" id="dayinfo"></div>
  </div>
  <div id="groups"></div>
  <div id="error"></div>
</div>

<div class="bar" id="bar"><div class="inner">
  <div class="progress" id="progress"></div>
  <button class="submit" id="submitBtn">提出する</button>
</div></div>

<div id="done">
  <h2>提出しました</h2>
  <p id="doneMsg"></p>
  <p style="font-size:15px;color:#5F6670;">おつかれさまでした。</p>
  <p id="backWrap" style="display:none;margin-top:24px;"><a id="back2" href="#" style="display:inline-block;padding:14px 22px;border:1px solid var(--c);border-radius:12px;color:var(--c);text-decoration:none;font-weight:700;">ポータルに戻る</a></p>
</div>

<div class="overlay" id="overlay"><div class="spinner"></div>送信しています…</div>

</div>

<script>
// ===== 版の番号・設定 =====
var PAGE_VERSION = '2026-10-07g';
var PORTAL_URL = '../';            // ポータル(同じサイト)
var T0 = Date.now();
function g(id) { return document.getElementById(id); }
function gate(msg, linkToPortal) {
  g('gspin').style.display = 'none';
  g('gmsg').textContent = msg;
  if (linkToPortal) g('gact').innerHTML = '<a class="gbtn" href="' + PORTAL_URL + '">ポータルに戻る</a>';
}
g('gver').textContent = 'ver ' + PAGE_VERSION;

// ===== ポータルから受け取った通行証とデータの入口 =====
var S = null;
try { S = JSON.parse(sessionStorage.getItem('portal_session') || 'null'); } catch (e) { S = null; }
var STORE = new URLSearchParams(location.search).get('store') || '';
var API = S && S.apis ? S.apis.closing : '';

// データの入口(BotのGAS)とやりとりする。GASはまれに一時的なエラーのページを返すので、retry が true なら1回だけやり直す
function api(action, extra, retry) {
  var body = JSON.stringify(Object.assign({ app: 'closing', action: action, token: S.token, store: STORE }, extra || {}));
  function once() {
    var status = 0;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body })
      .then(function (r) { status = r.status; return r.text(); }, function (e) {
        var err = new Error('通信できませんでした(' + (e && e.message ? e.message : e) + ')'); err.stage = 'fetch'; throw err;
      })
      .then(function (t) {
        try { return JSON.parse(t); } catch (e) {
          // JSONでない＝BotのURL違い・公開範囲・古いデプロイなど。返ってきた文の一部を見せる
          var err = new Error('正しい返事ではありませんでした(' + status + '): ' + String(t).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 160));
          err.stage = 'response'; throw err;
        }
      });
  }
  return once().catch(function (e) {
    if (!retry) throw e;
    return new Promise(function (ok) { setTimeout(ok, 800); }).then(once);
  });
}

if (!S || !S.token || S.exp < Date.now()) {
  gate('ポータルから開き直してください。\n(ログインの期限が切れたか、直接開かれました)', true);
} else if (!API || !STORE) {
  gate('開く店舗やツールが分かりませんでした。\nポータルから開き直してください。', true);
} else {
  // ポータルが先読みしたデータ(3分以内)があれば、待たずに表示して、裏で最新を確かめる
  var pre = readPrefetch();
  if (pre) {
    showForm(pre, '先読み');
    api('closing.init', {}, true).then(function (res) {
      if (res.ok && window.__refreshForm) window.__refreshForm(res.init);
    }).catch(function () {});
  } else {
    loadNow();
  }
}

function readPrefetch() {
  try {
    var x = JSON.parse(sessionStorage.getItem('prefetch_closing') || 'null');
    return x && Date.now() - x.at < 3 * 60 * 1000 && x.inits && x.inits[STORE] ? x.inits[STORE] : null;
  } catch (e) { return null; }
}

function showForm(D, how) {
  D.portalUrl = PORTAL_URL;
  D.clientMs = Date.now() - T0;
  D.how = how;
  g('gate').style.display = 'none';
  g('app').style.display = 'block';
  startForm(D);
}

function loadNow() {
  api('closing.init', {}, true).then(function (res) {
    if (!res.ok) {
      gate(res.error === 'AUTH' ? 'ログインの期限が切れました。\nポータルから開き直してください。' : '開けませんでした：' + res.error, true);
      return;
    }
    showForm(res.init, '取得');
  }).catch(function (e) {
    gate(e && e.stage === 'response' ? 'データを受け取れませんでした。\n管理者に連絡してください。' : '通信に失敗しました。\n電波の良いところで開き直してください。', true);
    // 原因を調べるための表示(秘密は含まない。通行証は出さない)
    g('gdetail').textContent = '[' + (e && e.stage || '?') + '] ' + (e && e.message ? e.message : e) + ' ／ API: ' + String(API).replace(/\/macros\/s\/([^/]{6})[^/]*/, '/macros/s/$1…');
  });
}

function startForm(D) {
  var A = {}; // 項目ID → 値（チェックは true/false）
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  document.documentElement.style.setProperty('--c', D.store.color);
  $('storeName').textContent = D.store.name;
  if (D.userName) $('me').textContent = D.userName + ' さん';
  // ポータルに戻る(同じサイトの中の移動)
  if (D.portalUrl) {
    $('back').href = D.portalUrl; $('back').style.visibility = 'visible';
    $('back2').href = D.portalUrl; $('backWrap').style.display = 'block';
  }
  // サーバー側でかかった時間(重さの原因を調べるため)
  $('timing').textContent = 'ver ' + PAGE_VERSION + '・開くまで ' + (D.clientMs / 1000).toFixed(1) + '秒(' + (D.how || '') + ')' +
    (D.timing && D.how === '取得' ? '(サーバー：' + Object.keys(D.timing).map(function (k) { return k + ' ' + (D.timing[k] / 1000).toFixed(1); }).join('・') +
      '・通信と起動 ' + Math.max(0, (D.clientMs - Object.keys(D.timing).reduce(function (a, k) { return a + D.timing[k]; }, 0)) / 1000).toFixed(1) + ')' : '');
  $('date').innerHTML = D.dates.map(function (d) { return '<option value="' + esc(d.ymd) + '">' + esc(d.label) + '</option>'; }).join('');

  // 選んだ営業日の情報（料金区分・祝日・トピック・提出済みか）
  function dayOf(ymd) { return D.dates.filter(function (d) { return d.ymd === ymd; })[0]; }
  function renderDay() {
    var d = dayOf($('date').value);
    var h = '<div class="price">' + esc(d.closed ? '休業日' : d.price) + (d.holiday ? '<span style="font-weight:400;font-size:16px;">　' + esc(d.holiday) + '</span>' : '') + '</div>';
    if (d.topic) h += '<div class="topic"><b>トピック・イベント</b>\n' + esc(d.topic) + '</div>';
    if (d.submitted) h += '<div class="done">この日は提出済みです。提出すると上書きします。</div>';
    $('dayinfo').innerHTML = h;
  }
  $('date').addEventListener('change', renderDay);
  renderDay();

  // 先読みで表示したあと、裏で受け取った最新の内容を反映する
  //   営業日の情報(料金区分・トピック・提出済み)は差し替える。営業日や項目が変わっていたら、読み込み直しを案内する
  window.__refreshForm = function (N) {
    var sameDays = JSON.stringify(N.dates.map(function (d) { return d.ymd; })) === JSON.stringify(D.dates.map(function (d) { return d.ymd; }));
    var sameItems = JSON.stringify(N.items) === JSON.stringify(D.items);
    if (sameDays) { N.dates.forEach(function (d, i) { D.dates[i] = d; }); renderDay(); }
    if (!sameDays || !sameItems) {
      $('error').innerHTML = '内容が更新されています。<a href="#" id="reloadNow">読み込み直す</a>(入力した内容は消えます)';
      $('reloadNow').addEventListener('click', function (e) {
        e.preventDefault();
        try { sessionStorage.removeItem('prefetch_closing'); } catch (x) {}
        location.reload();
      });
    }
  };

  // グループごとにカードを作る
  var groups = [];
  D.items.forEach(function (it) {
    var g = groups.filter(function (x) { return x.name === it.group; })[0];
    if (!g) { g = { name: it.group, items: [] }; groups.push(g); }
    g.items.push(it);
    if (it.type === 'チェック') A[it.id] = false;
  });
  $('groups').innerHTML = groups.map(function (g, gi) {
    return '<div class="card" id="g' + gi + '">' + (g.name ? '<div class="card-title">' + esc(g.name) + '</div>' : '') +
      g.items.map(itemHtml).join('') + '</div>';
  }).join('');

  function itemHtml(it) {
    var req = it.type !== 'チェック' && (it.required || it.reqIf) ? '<span class="badge" id="req-' + esc(it.id) + '"' + (it.reqIf ? ' style="display:none"' : '') + '>必須</span>' : '';
    if (it.type === 'チェック') {
      return '<div class="check" data-id="' + esc(it.id) + '"><div class="box"></div><div>' + esc(it.label) + '</div></div>';
    }
    var h = '<div class="field" data-field="' + esc(it.id) + '"><label>' + esc(it.label) + req + '</label>';
    if (it.type === '数値') {
      var range = '';
      if (it.min !== null || it.max !== null) {
        range = '<div class="note" id="note-' + esc(it.id) + '">' +
          (it.min !== null && it.max !== null && it.min === it.max ? it.min + esc(it.unit) + ' 以外は報告で注意表示されます'
            : '目安：' + (it.min !== null ? it.min : '') + '〜' + (it.max !== null ? it.max : '') + esc(it.unit)) + '</div>';
      }
      h += '<div class="num"><input type="text" inputmode="decimal" data-id="' + esc(it.id) + '" placeholder="0"><span class="unit">' + esc(it.unit) + '</span></div>' + range;
    } else if (it.type === '選択') {
      h += '<div class="chips" data-id="' + esc(it.id) + '">' + it.choices.map(function (c) {
        return '<button type="button" class="chip" data-v="' + esc(c) + '">' + esc(c) + '</button>';
      }).join('') + '</div>';
    } else if (it.type === '自由記述') {
      h += '<textarea data-id="' + esc(it.id) + '" placeholder="なければ空欄で大丈夫です"></textarea>';
    } else {
      h += '<input type="text" data-id="' + esc(it.id) + '">';
    }
    return h + '</div>';
  }

  function itemOf(id) { return D.items.filter(function (x) { return x.id === id; })[0]; }

  // 「必須の条件」付きの項目：条件の項目の入力に合わせて必須の印を出し入れする
  function isRequired(it) {
    if (!it.reqIf) return it.required;
    var a = A[it.reqIf.id];
    if (it.reqIf.value === null) return a === true || (a !== false && a != null && String(a).trim() !== '');
    return String(a == null ? '' : a).trim() === it.reqIf.value;
  }
  function updateRequired() {
    D.items.forEach(function (it) {
      if (!it.reqIf) return;
      var b = $('req-' + it.id);
      if (b) b.style.display = isRequired(it) ? '' : 'none';
    });
  }

  // ---- 入力の反映 ----
  Array.prototype.forEach.call(document.querySelectorAll('.check'), function (el) {
    el.addEventListener('click', function () {
      var id = el.getAttribute('data-id');
      A[id] = !A[id];
      el.classList.toggle('on', A[id]);
      el.querySelector('.box').textContent = A[id] ? '✓' : '';
      progress();
      updateRequired();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chips'), function (box) {
    box.addEventListener('click', function (e) {
      var b = e.target.closest('.chip');
      if (!b) return;
      var id = box.getAttribute('data-id');
      var v = b.getAttribute('data-v');
      A[id] = A[id] === v ? '' : v; // もう一度押すと解除
      Array.prototype.forEach.call(box.querySelectorAll('.chip'), function (c) { c.classList.toggle('on', c.getAttribute('data-v') === A[id]); });
      clearMissing(box);
      updateRequired();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('input[data-id], textarea[data-id]'), function (el) {
    el.addEventListener('input', function () {
      var id = el.getAttribute('data-id');
      var it = itemOf(id);
      var v = el.value;
      if (it.type === '数値') {
        v = v.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
             .replace(/[ー－−]/g, '-').replace(/[，,円]/g, '').trim();
        var note = $('note-' + id);
        if (note) {
          var n = Number(v);
          var out = v !== '' && !isNaN(n) && ((it.min !== null && n < it.min) || (it.max !== null && n > it.max));
          note.classList.toggle('warn', out);
        }
      }
      A[id] = v;
      clearMissing(el);
      updateRequired();
    });
  });

  function checks() { return D.items.filter(function (x) { return x.type === 'チェック'; }); }
  function progress() {
    var c = checks();
    var on = c.filter(function (x) { return A[x.id] === true; }).length;
    $('progress').textContent = c.length ? 'チェック ' + on + ' / ' + c.length : '';
  }
  progress();

  function cardOf(el) { return el.closest('.card'); }
  function clearMissing(el) { var c = cardOf(el); if (c) c.classList.remove('missing'); $('error').textContent = ''; }

  // ---- 提出 ----
  $('submitBtn').addEventListener('click', function () { submit(false); });

  function submit(confirmOverwrite) {
    $('error').textContent = '';
    var missing = [];
    D.items.forEach(function (it) {
      if (it.type === 'チェック') return;
      var v = A[it.id];
      var el = document.querySelector('[data-field="' + it.id + '"]');
      if (isRequired(it) && (v == null || String(v).trim() === '')) missing.push({ el: el, label: it.label });
      else if (it.type === '数値' && v && isNaN(Number(v))) missing.push({ el: el, label: it.label + '（数字で入力）' });
    });
    if (missing.length) {
      missing.forEach(function (m) { var c = cardOf(m.el); if (c) c.classList.add('missing'); });
      $('error').textContent = '入力が必要な項目があります：\n' + missing.map(function (m) { return m.label; }).join('、');
      cardOf(missing[0].el).scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (!confirmOverwrite) {
      var un = checks().filter(function (x) { return A[x.id] !== true; });
      if (un.length && !window.confirm('チェックしていない項目が ' + un.length + '件あります。\nこのまま提出しますか？\n（未チェックの項目はチャットで報告されます）')) return;
    }

    $('overlay').style.display = 'flex';
    $('submitBtn').disabled = true;
    // 提出は二重送信を避けるため、自動のやり直しはしない
    api('closing.submit', { payload: { date: $('date').value, answers: A, confirmOverwrite: !!confirmOverwrite } }, false)
      .then(function (res) {
        if (!res.ok) throw new Error(res.error === 'AUTH' ? 'AUTH:' + (res.reason || '') : res.error);
        $('overlay').style.display = 'none';
        $('submitBtn').disabled = false;
        if (res && res.needConfirm) {
          if (window.confirm('この営業日の締めチェックは提出済みです。\n内容を上書きしますか？')) submit(true);
          return;
        }
        $('main').style.display = 'none';
        $('bar').style.display = 'none';
        $('doneMsg').textContent = res.notified ? 'チャットに報告しました。' : '記録しました（チャットへの報告は失敗したため、管理者に通知しました）。';
        $('done').style.display = 'block';
        window.scrollTo(0, 0);
      })
      .catch(function (e) {
        $('overlay').style.display = 'none';
        $('submitBtn').disabled = false;
        var msg = String(e && e.message ? e.message : e);
        if (msg.indexOf('AUTH:') !== -1) {
          // 通行証の期限切れなど。入力内容は送られていない
          $('error').innerHTML = esc('ログインの有効期限が切れたため、送信できませんでした。入力内容は送られていません。') +
            '<br><a href="' + PORTAL_URL + '">ポータルから開き直す</a>';
          return;
        }
        $('error').textContent = '送信できませんでした：' + msg + '\n通信状態を確認して、もう一度押してください。';
      });
  }
}
</script>
</body>
</html>
