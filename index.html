<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認中</title>
<!--
  入口ページ(Netlifyに index.html として置く)
  開き方：LINE WORKSのトーク・メニューに置いたWOFFのリンクをタップする(リンクは1つだけ)
    → 本人を確認し、その人が使えるツールのボタンを並べる。使えるツールが1つだけなら、そのまま開く
    (WOFFはリンクに付けたパラメータをページに渡さないため、ツールはページの中で選ぶ形にしている)
  ログイン画面は無い。LINE WORKSのアプリ内で開くと、開いた人のUserIdを受け取って自動で照合し、ツールへ移動する。
  アプリの外(普通のブラウザ)で開かれた場合は、ログインさせずに「LINE WORKSのアプリから開いてください」と案内するだけ

  ※ このページには秘密情報を置かない。置くのは WOFF ID と認証基盤のURL(公開されても困らない値)だけ
-->

<!-- ▼ WOFF SDK：PoCで動いた <script> の行(3.7.1・charset="utf-8" 付き)と同じか確認して、違えばPoCの行を使う -->
<script charset="utf-8" src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>

<style>
  :root { --c: #16323A; --muted: #5F6670; --err: #B42318; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F5F6F8;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #1F2328; }
  .box { width: min(440px, 92vw); background: #fff; border: 1px solid #D5DAE0; border-radius: 16px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 16px; color: var(--c); }
  #msg { font-size: 18px; line-height: 1.7; white-space: pre-wrap; }
  #msg.err { color: var(--err); font-weight: 700; }
  .spinner { width: 40px; height: 40px; margin: 0 auto 16px; border: 5px solid #E8EEF0; border-top-color: var(--c); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn { display: inline-block; margin-top: 20px; padding: 16px 28px; font-size: 18px; font-weight: 700; color: #fff; background: var(--c);
    border: none; border-radius: 12px; text-decoration: none; cursor: pointer; font-family: inherit; }
  .sub { font-size: 14px; color: var(--muted); margin-top: 16px; }
  .menu { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
  .menu .btn { margin-top: 0; display: block; }
  #detail { font-size: 12px; color: var(--muted); margin-top: 14px; word-break: break-all; text-align: left; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spin"></div>
  <div id="msg">確認しています…</div>
  <div id="action"></div>
  <div id="detail"></div>
  <div id="ver" style="font-size:11px;color:#9AA3AD;margin-top:18px;"></div>
</div>

<script>
// ===== 版の番号(どの版のページが表示されているかを、ページの一番下に出す。更新したら書き換える) =====
const PAGE_VERSION = '2026-10-06h';
document.getElementById('ver').textContent = 'ver ' + PAGE_VERSION;

// ===== 設定(秘密情報ではない) =====
const WOFF_ID = 'zOLRGLwYG4i71sA08_geGw';
const AUTH_API = 'https://script.google.com/macros/s/AKfycbyrk69F7F1E1LatE1e0hz_V2p8FVtdx5FxJQTJSDuiMDg7ETCXoLCJc3ZwynbArvSVClA/exec';

// ===== 開きたいツールとパラメータ(ログインで画面が切り替わっても失わないよう保存しておく) =====
const KEY = 'entry_request';
// URLの中から「tool=…」を含む部分を探す。WOFFやログインの戻りで包まれて(エンコードされて)いても読む
function findToolQuery(str) {
  let s = String(str || '');
  for (let i = 0; i < 3; i++) {
    const idx = s.search(/(?:^|[?&#])tool=/);
    if (idx !== -1) {
      const at = s.charAt(idx) === 't' ? idx : idx + 1;
      const begin = Math.max(s.lastIndexOf('?', at), s.lastIndexOf('#', at)); // 「tool=」を含む区切りの先頭
      return new URLSearchParams(s.slice(begin + 1).split('#')[0]);
    }
    let d;
    try { d = decodeURIComponent(s); } catch (e) { break; }
    if (d === s) break;
    s = d;
  }
  return null;
}
function readQuery() {
  return findToolQuery(location.search) || findToolQuery(location.hash) || new URLSearchParams(location.search);
}

function readRequest() {
  const q = readQuery();
  if (q.get('tool')) {
    const params = {};
    q.forEach((v, k) => { if (k !== 'tool') params[k] = v; });
    const req = { tool: q.get('tool'), params: params };
    try { sessionStorage.setItem(KEY, JSON.stringify(req)); } catch (e) {}
    return req;
  }
  try { return JSON.parse(sessionStorage.getItem(KEY) || 'null') || { tool: '', params: {} }; } catch (e) { return { tool: '', params: {} }; }
}
const REQUEST = readRequest();

const $ = id => document.getElementById(id);
const escHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const escAttr = escHtml;
function show(text, isErr) {
  $('msg').textContent = text;
  $('msg').className = isErr ? 'err' : '';
  $('spin').style.display = isErr || $('action').innerHTML ? 'none' : 'block';
}
function setAction(html) { $('action').innerHTML = html; $('spin').style.display = html ? 'none' : 'block'; }

const ERRORS = {
  invalid_token: 'ログインを確認できませんでした。\nLINE WORKSのアプリから開き直してください。',
  not_registered: 'スタッフとして登録されていません。\n利用するには申請が必要です。',
  inactive: '現在、利用できない状態になっています。\n管理者に連絡してください。',
  no_permission: '使える権限がありません。\n必要な場合は管理者に申請してください。',
  no_store_permission: 'この店舗のページを開く権限がありません。\n所属している店舗のリンクから開いてください。',
  unknown_tool: '開こうとしたツールが見つかりません。\nリンクが正しいか確認してください。',
  no_tool: '開くツールが指定されていません。\nLINE WORKSのリンクから開いてください。',
  bad_request: 'うまく確認できませんでした。\nもう一度開き直してください。',
  internal_error: '一時的なエラーが起きました。\n少し待ってから開き直してください。',
};

// ===== 本体 =====
async function start() {
  if (typeof woff === 'undefined') { show('ログインの部品を読み込めませんでした。\n通信状態を確認して開き直してください。', true); return; }
  try {
    await woff.init({ woffId: WOFF_ID });
  } catch (e) {
    show('LINE WORKSの準備に失敗しました。\n開き直してください。', true);
    return;
  }
  if (!woff.isLoggedIn()) {
    const inClient = typeof woff.isInClient === 'function' ? woff.isInClient() : null;
    detail('state', { message: 'inClient=' + inClient + ' / ' + location.host });
    if (inClient === false) {
      // アプリの外(普通のブラウザやGitHub PagesのURLを直接開いた場合)。ログイン画面は出さない
      show('このページはLINE WORKSのアプリから開いてください。\n（トークにあるリンクをタップ）', true);
      return;
    }
    // アプリ内(または判定できない)：一度だけ自動で login() を呼ぶ。アプリがログイン情報を持っているので入力画面は出ない想定
    let tried = null;
    try { tried = sessionStorage.getItem(KEY + '_login'); } catch (e) {}
    if (!tried) {
      try { sessionStorage.setItem(KEY + '_login', '1'); } catch (e) {}
      show('LINE WORKSの情報を確認しています…');
      try { woff.login(); } catch (e) { detail('login', e); }
      // 画面が切り替わらなかったときだけ、タップで続けるボタンを出す(ブラウザの制約で自動では進めない場合がある)
      setTimeout(() => {
        show('もう一度確認します。');
        setAction('<button class="btn" id="cont">続ける</button>');
        $('cont').addEventListener('click', () => woff.login());
      }, 2500);
      return;
    }
    // login() のあと戻ってきても未ログインのまま
    show('LINE WORKSのログインを確認できませんでした。\nトークのリンクから開き直してください。', true);
    try { sessionStorage.removeItem(KEY + '_login'); } catch (e) {}
    return;
  }
  try { sessionStorage.removeItem(KEY + '_login'); } catch (e) {}
  await authenticate();
}

// 失敗したときに、どの段階で何が起きたかを小さく表示する(管理者が原因を調べるため。秘密は含まない)
function detail(stage, e) {
  $('detail').textContent = '[' + stage + '] ' + (e && e.message ? e.message : String(e || ''));
}

async function authenticate() {
  show('スタッフ情報を確認しています…');
  let accessToken, profile, r, text, res;
  // 1. LINE WORKSから本人の情報を受け取る
  try {
    accessToken = woff.getAccessToken();
    profile = await woff.getProfile();
  } catch (e) {
    show('LINE WORKSから情報を受け取れませんでした。\nアプリから開き直してください。', true);
    detail('profile', e);
    return;
  }
  // 2. 認証基盤に問い合わせる
  try {
    r = await fetch(AUTH_API, {
      method: 'POST',
      // text/plain で送る(application/json だと事前確認の通信が走り、GASが受け付けないため)
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accessToken: accessToken, userId: profile.userId, tool: REQUEST.tool, params: REQUEST.params }),
    });
    text = await r.text();
  } catch (e) {
    show('通信に失敗しました。\n電波の良いところで開き直してください。', true);
    detail('fetch', e);
    return;
  }
  // 3. 返事を読む(JSONでなければ、URL違い・公開範囲・デプロイの問題)
  try {
    res = JSON.parse(text);
  } catch (e) {
    show('認証の仕組みから正しい返事がありませんでした。\n管理者に連絡してください。', true);
    detail('response ' + r.status, { message: text.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 160) });
    return;
  }
  // ツールの一覧(ふだんの使い方)：1つだけならそのまま開く。2つ以上ならボタンを並べる
  if (res.ok && res.menu) {
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    if (res.menu.length === 1) {
      show((res.name ? res.name + ' さん、' : '') + res.menu[0].label + 'を開いています…');
      location.replace(res.menu[0].redirect);
      return;
    }
    show((res.name ? res.name + ' さん\n' : '') + '開くものを選んでください');
    setAction('<div class="menu">' + res.menu.map(m =>
      '<a class="btn" href="' + escAttr(m.redirect) + '">' + escHtml(m.label) + '</a>').join('') + '</div>');
    return;
  }
  if (res.ok && res.redirect) {
    show((res.name ? res.name + ' さん、' : '') + 'ツールを開いています…');
    try { sessionStorage.removeItem(KEY); } catch (e) {}
    location.replace(res.redirect);
    return;
  }
  show(ERRORS[res.error] || ERRORS.internal_error, true);
  if (res.error === 'not_registered' && res.applyUrl) {
    setAction('<a class="btn" href="' + encodeURI(res.applyUrl) + '">利用を申請する</a>');
  }
}

start();
</script>
</body>
</html>
