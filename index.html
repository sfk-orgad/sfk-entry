<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業務ポータル</title>
<!--
  業務ポータル(GitHub Pages に index.html として置く)
  開き方：LINE WORKSのトーク・メニューに置いたWOFFのリンクをタップする(リンクは1つだけ)
    → 本人を確認し、今日の営業と、その人が使えるツールのカードを並べる
  ※ このページには秘密情報を置かない。置くのは WOFF ID と認証基盤のURL(公開されても困らない値)だけ
  ※ 表示する中身(ツール・店舗・今日の営業)は、すべて認証のあとに認証基盤から受け取る(このファイルには持たない)
-->

<!-- ▼ WOFF SDK：PoCで動いた <script> の行(3.7.1・charset="utf-8" 付き)と同じか確認して、違えばPoCの行を使う -->
<script charset="utf-8" src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>

<style>
  :root { --c: #16323A; --soft: #E8EEF0; --ink: #1F2328; --muted: #5F6670; --line: #D5DAE0; --bg: #F5F6F8; --err: #B42318; --hol: #B42318; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 17px; line-height: 1.5; }
  /* 確認中・エラーの画面 */
  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { width: min(440px, 92vw); background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; text-align: center; }
  #msg { font-size: 18px; line-height: 1.7; white-space: pre-wrap; }
  #msg.err { color: var(--err); font-weight: 700; }
  .spinner { width: 40px; height: 40px; margin: 0 auto 16px; border: 5px solid var(--soft); border-top-color: var(--c); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn { display: inline-block; margin-top: 20px; padding: 16px 28px; font-size: 18px; font-weight: 700; color: #fff; background: var(--c);
    border: none; border-radius: 12px; text-decoration: none; cursor: pointer; font-family: inherit; }
  #detail { font-size: 12px; color: var(--muted); margin-top: 14px; word-break: break-all; text-align: left; }
  .ver { font-size: 11px; color: #9AA3AD; margin-top: 18px; text-align: center; }
  /* ポータル */
  #portal { display: none; }
  header { background: var(--c); color: #fff; padding: 18px 16px 16px; position: relative; }
  header h1 { margin: 0; font-size: 22px; }
  .me { position: absolute; top: 10px; right: 14px; font-size: 14px; opacity: .9; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 12px 40px; }
  .today { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
  .today h2 { font-size: 16px; margin: 0 0 8px; color: var(--muted); font-weight: 700; }
  .store { padding: 8px 0; border-top: 1px solid #EEF1F4; }
  .store:first-of-type { border-top: none; }
  .store .head { font-weight: 700; }
  .price { display: inline-block; font-size: 14px; padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--c); margin-left: 6px; }
  .price.closed { background: #FDECEA; color: var(--err); }
  .hol { font-size: 13px; color: var(--hol); margin-left: 6px; }
  .topics { margin: 4px 0 0; padding-left: 1.2em; font-size: 15px; }
  .cat { font-size: 15px; color: var(--muted); font-weight: 700; margin: 20px 4px 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }
  .tile { display: flex; flex-direction: column; gap: 4px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; cursor: pointer; font-family: inherit; color: var(--ink); min-height: 96px; }
  .tile:active { background: var(--soft); }
  .tile .icon { font-size: 26px; line-height: 1; }
  .tile .name { font-size: 17px; font-weight: 700; }
  .tile .tag { font-size: 12px; color: var(--c); background: var(--soft); border-radius: 999px; padding: 1px 8px; align-self: flex-start; }
  .tile .desc { font-size: 13px; color: var(--muted); }
  .empty { font-size: 15px; color: var(--muted); margin-top: 20px; text-align: center; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,.92); z-index: 50; align-items: center; justify-content: center; flex-direction: column; }
</style>
</head>
<body>
<div id="gate"><div class="box">
  <div class="spinner" id="spin"></div>
  <div id="msg">確認しています…</div>
  <div id="action"></div>
  <div id="detail"></div>
  <div class="ver" id="ver"></div>
</div></div>

<div id="portal">
  <header><div class="me" id="me"></div><h1>業務ポータル</h1></header>
  <div class="wrap">
    <div id="today"></div>
    <div id="tools"></div>
    <div class="ver" id="ver2"></div>
  </div>
</div>
<div class="overlay" id="overlay"><div class="spinner"></div><div>開いています…</div></div>

<script>
// ===== 版の番号(どの版のページが表示されているかを、ページの一番下に出す。更新したら書き換える) =====
const PAGE_VERSION = '2026-10-07c';
const T0 = Date.now();
const TIMES = [];
function showVer() {
  const t = 'ver ' + PAGE_VERSION + (TIMES.length ? '・' + TIMES.join('・') : '');
  document.getElementById('ver').textContent = t;
  document.getElementById('ver2').textContent = t;
}
function lap(label, from) { TIMES.push(label + ' ' + ((Date.now() - from) / 1000).toFixed(1) + '秒'); showVer(); }
showVer();

// ===== 設定(秘密情報ではない) =====
const WOFF_ID = 'zOLRGLwYG4i71sA08_geGw';
const AUTH_API = 'https://script.google.com/macros/s/AKfycbyrk69F7F1E1LatE1e0hz_V2p8FVtdx5FxJQTJSDuiMDg7ETCXoLCJc3ZwynbArvSVClA/exec';
const REFRESH_AFTER_MS = 8 * 60 * 1000; // 通行証は発行から10分で入場できなくなるので、8分たっていたら押したときに取り直す
const SAVE_KEY = 'portal_data';          // ポータルの表示内容(8分間)。戻ってきたときに認証基盤を呼ばずに表示する
const USED_KEY = 'portal_used';          // 開いたツール(通行証は使い捨てなので、同じツールを開き直すときは取り直す)
function saved() {
  try {
    const x = JSON.parse(sessionStorage.getItem(SAVE_KEY) || 'null');
    return x && Date.now() - x.at < REFRESH_AFTER_MS ? x : null;
  } catch (e) { return null; }
}
function used() { try { return JSON.parse(sessionStorage.getItem(USED_KEY) || '[]'); } catch (e) { return []; } }

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function show(text, isErr) {
  $('msg').textContent = text;
  $('msg').className = isErr ? 'err' : '';
  $('spin').style.display = isErr || $('action').innerHTML ? 'none' : 'block';
}
function setAction(html) { $('action').innerHTML = html; $('spin').style.display = html ? 'none' : 'block'; }
function detail(stage, e) { $('detail').textContent = '[' + stage + '] ' + (e && e.message ? e.message : String(e || '')); }

// ===== ツールの直接指定(?tool=…)。WOFFはパラメータを渡さないので通常は使わないが、将来のために残す =====
const KEY = 'entry_request';
function findToolQuery(str) {
  let s = String(str || '');
  for (let i = 0; i < 3; i++) {
    const idx = s.search(/(?:^|[?&#])tool=/);
    if (idx !== -1) {
      const at = s.charAt(idx) === 't' ? idx : idx + 1;
      const begin = Math.max(s.lastIndexOf('?', at), s.lastIndexOf('#', at));
      return new URLSearchParams(s.slice(begin + 1).split('#')[0]);
    }
    let d;
    try { d = decodeURIComponent(s); } catch (e) { break; }
    if (d === s) break;
    s = d;
  }
  return null;
}
function readRequest() {
  const q = findToolQuery(location.search) || findToolQuery(location.hash);
  if (q && q.get('tool')) {
    const params = {};
    q.forEach((v, k) => { if (k !== 'tool') params[k] = v; });
    return { tool: q.get('tool'), params: params };
  }
  return { tool: '', params: {} };
}
const REQUEST = readRequest();

const ERRORS = {
  invalid_token: 'ログインを確認できませんでした。\nLINE WORKSのアプリから開き直してください。',
  not_registered: 'スタッフとして登録されていません。\n利用するには申請が必要です。',
  inactive: '現在、利用できない状態になっています。\n管理者に連絡してください。',
  no_permission: '使える権限がありません。\n必要な場合は管理者に申請してください。',
  no_store_permission: 'この店舗のページを開く権限がありません。',
  unknown_tool: '開こうとしたツールが見つかりません。',
  bad_request: 'うまく確認できませんでした。\nもう一度開き直してください。',
  internal_error: '一時的なエラーが起きました。\n少し待ってから開き直してください。',
};

// ===== 本体 =====
async function start() {
  // 8分以内に表示した内容があれば、それを使う(「‹ ポータル」で戻ったとき・開き直したときに速く出す)
  const keep = !REQUEST.tool && saved();
  if (keep) { TIMES.push('前回の表示を使用'); showVer(); renderPortal(keep.res, keep.at); return; }
  if (typeof woff === 'undefined') { show('ログインの部品を読み込めませんでした。\n通信状態を確認して開き直してください。', true); return; }
  try {
    await woff.init({ woffId: WOFF_ID });
  } catch (e) {
    show('LINE WORKSの準備に失敗しました。\n開き直してください。', true);
    detail('init', e);
    return;
  }
  if (!woff.isLoggedIn()) {
    const inClient = typeof woff.isInClient === 'function' ? woff.isInClient() : null;
    if (inClient === false) {
      show('このページはLINE WORKSのアプリから開いてください。\n（トークにあるリンクをタップ）', true);
      return;
    }
    let tried = null;
    try { tried = sessionStorage.getItem(KEY + '_login'); } catch (e) {}
    if (!tried) {
      try { sessionStorage.setItem(KEY + '_login', '1'); } catch (e) {}
      show('LINE WORKSの情報を確認しています…');
      try { woff.login(); } catch (e) { detail('login', e); }
      setTimeout(() => {
        show('もう一度確認します。');
        setAction('<button class="btn" id="cont">続ける</button>');
        $('cont').addEventListener('click', () => woff.login());
      }, 2500);
      return;
    }
    show('LINE WORKSのログインを確認できませんでした。\nトークのリンクから開き直してください。', true);
    try { sessionStorage.removeItem(KEY + '_login'); } catch (e) {}
    return;
  }
  try { sessionStorage.removeItem(KEY + '_login'); } catch (e) {}
  WOFF_READY = true;
  lap('LINE WORKS', T0);
  const res = await callAuth();
  if (!res) return;
  if (res.ok && res.redirect) { location.replace(res.redirect); return; } // ツールの直接指定
  if (res.ok && res.items) { renderPortal(res); return; }
  show(ERRORS[res.error] || ERRORS.internal_error, true);
  if (res.error === 'not_registered' && res.applyUrl) setAction('<a class="btn" href="' + esc(encodeURI(res.applyUrl)) + '">利用を申請する</a>');
}

// 覚えていた内容で表示したあと、通行証を取り直すときに WOFF を準備する(1回だけ)
let WOFF_READY = false;
async function ensureWoff() {
  if (WOFF_READY) return true;
  try {
    await woff.init({ woffId: WOFF_ID });
    WOFF_READY = woff.isLoggedIn();
  } catch (e) { detail('init', e); }
  return WOFF_READY;
}

// 認証基盤に問い合わせる(失敗したら画面にメッセージを出して null を返す)
async function callAuth() {
  let accessToken, profile, r, text, res;
  if (!(await ensureWoff())) {
    show('LINE WORKSのログインを確認できませんでした。\nトークのリンクから開き直してください。', true); return null;
  }
  try {
    accessToken = woff.getAccessToken();
    profile = await woff.getProfile();
  } catch (e) {
    show('LINE WORKSから情報を受け取れませんでした。\nアプリから開き直してください。', true); detail('profile', e); return null;
  }
  const t2 = Date.now();
  const body = JSON.stringify({ accessToken: accessToken, userId: profile.userId, tool: REQUEST.tool, params: REQUEST.params });
  // GASはまれに一時的なエラーのページを返すので、正しい返事でなければ1回だけやり直す
  for (let attempt = 1; attempt <= 2; attempt++) {
    try {
      r = await fetch(AUTH_API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // application/json だと事前確認の通信が走り、GASが受け付けない
        body: body,
      });
      text = await r.text();
      res = JSON.parse(text);
      break;
    } catch (e) {
      if (attempt === 2) {
        if (text === undefined) { show('通信に失敗しました。\n電波の良いところで開き直してください。', true); detail('fetch', e); }
        else {
          show('認証の仕組みから正しい返事がありませんでした。\n少し待ってから開き直してください。', true);
          detail('response ' + (r ? r.status : '?'), { message: String(text).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 160) });
        }
        return null;
      }
      TIMES.push('やり直し'); text = undefined;
      await new Promise(ok => setTimeout(ok, 800));
    }
  }
  lap('認証', t2);
  if (res && res.timing) {
    const t = res.timing, sum = Object.keys(t).reduce((a, k) => a + t[k], 0);
    TIMES.push('(内訳 ' + Object.keys(t).map(k => k + (t[k] / 1000).toFixed(1)).join('・') + '・通信と起動' + Math.max(0, (Date.now() - t2 - sum) / 1000).toFixed(1) + ')');
    showVer();
  }
  return res;
}

// ===== ポータルの表示 =====
let DATA = null, FETCHED_AT = 0;
function renderPortal(res, at) {
  DATA = res; FETCHED_AT = at || Date.now();
  if (!at) {
    try { sessionStorage.setItem(SAVE_KEY, JSON.stringify({ at: FETCHED_AT, res: res })); sessionStorage.setItem(USED_KEY, '[]'); } catch (e) {}
  }
  warmTools(res.items);
  $('gate').style.display = 'none';
  $('portal').style.display = 'block';
  $('me').textContent = res.name ? res.name + ' さん' : '';

  // 今日の営業
  if (res.today && res.today.length) {
    $('today').innerHTML = '<div class="today"><h2>今日の営業 ' + esc(res.today[0].date) + '</h2>' + res.today.map(t =>
      '<div class="store"><span class="head">' + esc(t.name) + '</span>' +
      '<span class="price' + (t.closed ? ' closed' : '') + '">' + esc(t.closed ? '休業日' : t.price) + '</span>' +
      (t.holiday ? '<span class="hol">' + esc(t.holiday) + '</span>' : '') +
      (t.topics.length ? '<ul class="topics">' + t.topics.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '</div>'
    ).join('') + '</div>';
  } else {
    $('today').innerHTML = '';
  }

  // ツールのカード(カテゴリごと。カテゴリは表に出てきた順)
  const cats = [];
  res.items.forEach(it => { const c = it.category || 'ツール'; if (cats.indexOf(c) === -1) cats.push(c); });
  $('tools').innerHTML = res.items.length ? cats.map(c =>
    '<div class="cat">' + esc(c) + '</div><div class="grid">' + res.items.filter(it => (it.category || 'ツール') === c).map(it =>
      '<button class="tile" data-key="' + esc(it.key) + '">' +
      '<span class="icon">' + esc(it.icon || (it.kind === 'link' ? '🔗' : '📋')) + '</span>' +
      '<span class="name">' + esc(it.label) + '</span>' +
      (it.storeName ? '<span class="tag">' + esc(it.storeName) + '</span>' : '') +
      (it.desc ? '<span class="desc">' + esc(it.desc) + '</span>' : '') + '</button>'
    ).join('') + '</div>'
  ).join('') : '<div class="empty">使えるツールはまだありません。</div>';
}

// 裏でツール(GAS)を起こしておく：通行証を付けずに軽く呼ぶだけ(文字だけの案内が返る。何も消費しない)
// ボタンを押したときに、GASの起動を待たずに済むようにするため
function warmTools(items) {
  const bases = [];
  items.filter(it => it.kind !== 'link').forEach(it => {
    const u = String(it.redirect).replace(/([?&])t=[^&]*/, '$1').replace(/[?&]$/, '');
    const base = u.split('?')[0];
    if (bases.indexOf(base) === -1) { bases.push(base); fetch(base + '?warm=1', { mode: 'no-cors', cache: 'no-store' }).catch(() => {}); }
  });
}

// カードを押したとき：外部リンクはそのまま開く。GASのツールは、時間がたっていた・一度開いたものなら通行証を取り直してから開く
$('tools').addEventListener('click', async e => {
  const b = e.target.closest('.tile');
  if (!b) return;
  const key = b.getAttribute('data-key');
  let it = DATA.items.find(x => x.key === key);
  if (!it) return;
  if (it.kind !== 'link' && (Date.now() - FETCHED_AT > REFRESH_AFTER_MS || used().indexOf(key) !== -1)) {
    $('overlay').style.display = 'flex';
    const res = await callAuth();
    if (!res || !res.ok || !res.items) {
      $('overlay').style.display = 'none'; $('portal').style.display = 'none'; $('gate').style.display = 'flex';
      if (res && !res.ok) show(ERRORS[res.error] || ERRORS.internal_error, true);
      return;
    }
    renderPortal(res);
    it = res.items.find(x => x.key === key);
    if (!it) { $('overlay').style.display = 'none'; alert('このツールは使えなくなりました。'); return; }
  }
  if (it.kind !== 'link') { try { sessionStorage.setItem(USED_KEY, JSON.stringify(used().concat([key]))); } catch (e) {} }
  $('overlay').style.display = 'flex';
  location.href = it.redirect;
});
// ツールから「戻る」で帰ってきたときは、くるくるを消す
window.addEventListener('pageshow', () => { $('overlay').style.display = 'none'; });

start();
</script>
</body>
</html>
