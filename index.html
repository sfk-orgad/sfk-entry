<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>業務ポータル</title>
<!--
  業務ポータル(GitHub Pages に index.html として置く)
  開き方：LINE WORKSのトーク・メニューに置いたWOFFのリンクをタップする(リンクは1つだけ)
    → 本人を確認し、今日の営業と、その人が使えるツールのカードを並べる
  ※ このページには秘密情報を置かない。置くのは WOFF ID と認証基盤のURL(公開されても困らない値)だけ
  ※ 表示する中身(ツール・店舗・今日の営業)は、すべて認証のあとに認証基盤から受け取る(このファイルには持たない)
-->

<!-- ▼ WOFF SDK：PoCで動いた <script> の行(3.7.1・charset="utf-8" 付き)と同じか確認して、違えばPoCの行を使う -->
<script charset="utf-8" src="https://static.worksmobile.net/static/wm/woff/edge/3.7.1/sdk.js"></script>

<style>
  :root { --c: #16323A; --soft: #E8EEF0; --ink: #1F2328; --muted: #5F6670; --line: #D5DAE0; --bg: #F5F6F8; --err: #B42318; --hol: #B42318; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 17px; line-height: 1.5; }
  /* 確認中・エラーの画面 */
  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { width: min(440px, 92vw); background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; text-align: center; }
  #msg { font-size: 18px; line-height: 1.7; white-space: pre-wrap; }
  #msg.err { color: var(--err); font-weight: 700; }
  .spinner { width: 40px; height: 40px; margin: 0 auto 16px; border: 5px solid var(--soft); border-top-color: var(--c); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn { display: inline-block; margin-top: 20px; padding: 16px 28px; font-size: 18px; font-weight: 700; color: #fff; background: var(--c);
    border: none; border-radius: 12px; text-decoration: none; cursor: pointer; font-family: inherit; }
  #detail { font-size: 12px; color: var(--muted); margin-top: 14px; word-break: break-all; text-align: left; }
  .ver { font-size: 11px; color: #9AA3AD; margin-top: 18px; text-align: center; }
  /* ポータル */
  #portal { display: none; }
  header { background: var(--c); color: #fff; padding: 18px 16px 16px; position: relative; }
  header h1 { margin: 0; font-size: 22px; }
  .me { position: absolute; top: 10px; right: 14px; font-size: 14px; opacity: .9; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 12px 40px; }
  .news { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 8px; margin-top: 14px; }
  .news h2 { margin: 0 0 4px; font-size: 16px; }
  .news table { width: 100%; border-collapse: collapse; }
  .news td { padding: 9px 4px; border-bottom: 1px solid #EEF1F4; vertical-align: top; font-size: 16px; }
  .news tr:last-child td { border-bottom: none; }
  .news td.d { width: 3.6em; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .news a { color: var(--ink); text-decoration: none; display: block; }
  .news a.imp { color: #B42318; font-weight: 700; }
  .news .new { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; background: var(--c); border-radius: 999px; padding: 0 7px; margin-left: 6px; vertical-align: middle; }
  .news .none { color: var(--muted); font-size: 14px; padding: 6px 4px; }
  .news .more { display: block; text-align: right; font-size: 15px; color: var(--c); text-decoration: none; padding: 6px 2px 2px; font-weight: 700; }
  .today { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
  .today h2 { font-size: 16px; margin: 0 0 8px; color: var(--muted); font-weight: 700; }
  .store { padding: 8px 0; border-top: 1px solid #EEF1F4; }
  .store:first-of-type { border-top: none; }
  .store .head { font-weight: 700; }
  .price { display: inline-block; font-size: 14px; padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--c); margin-left: 6px; }
  .price.closed { background: #FDECEA; color: var(--err); }
  .hol { font-size: 13px; color: var(--hol); margin-left: 6px; }
  .topics { margin: 4px 0 0; padding-left: 1.2em; font-size: 15px; }
  .cat { font-size: 15px; color: var(--muted); font-weight: 700; margin: 20px 4px 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 360px) { .grid { grid-template-columns: 1fr; } }
  .tile { display: flex; flex-direction: column; gap: 4px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; cursor: pointer; font-family: inherit; color: var(--ink); min-height: 96px; }
  .tile:active { background: var(--soft); }
  .tile .icon { font-size: 26px; line-height: 1; }
  .tile .name { font-size: 17px; font-weight: 700; }
  .tile .tag { font-size: 12px; color: var(--c); background: var(--soft); border-radius: 999px; padding: 1px 8px; align-self: flex-start; }
  .tile .desc { font-size: 13px; color: var(--muted); }
  .empty { font-size: 15px; color: var(--muted); margin-top: 20px; text-align: center; }
  .tile.mnt { background: #F1F2F4; color: #8A9199; cursor: not-allowed; }
  .tile.mnt.tester { background: #FFF8E6; color: var(--ink); cursor: pointer; }
  .tile .mtag { font-size: 12px; color: #8A5A00; background: #FCE9C2; border-radius: 999px; padding: 1px 8px; align-self: flex-start; }
  .notice { background: #FFF8E6; border: 1px solid #F2D58A; border-radius: 14px; padding: 12px 16px; margin-top: 14px; font-size: 15px; white-space: pre-wrap; }
  .pcbtn { display: block; margin: 22px auto 0; font-size: 14px; color: var(--c); background: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; cursor: pointer; font-family: inherit; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; align-items: center; justify-content: center; padding: 20px; }
  .modal .panel { background: #fff; border-radius: 16px; padding: 24px 22px; max-width: 380px; width: 100%; text-align: center; }
  .code { font-size: 40px; font-weight: 700; letter-spacing: 8px; margin: 12px 0 6px; font-family: ui-monospace, Menlo, monospace; }
  .codein { font-size: 28px; letter-spacing: 6px; text-align: center; width: 220px; padding: 10px; border: 2px solid var(--line); border-radius: 12px; font-family: ui-monospace, Menlo, monospace; }
  .overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,.92); z-index: 50; align-items: center; justify-content: center; flex-direction: column; }
  .minecard { display: block; background: #fff; border: 1px solid #D5DAE0; border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; text-decoration: none; color: inherit; }
  .minecard .mrow { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; font-size: 16px; }
  .minecard .mh { font-size: 13px; color: #5F6670; min-width: 5.5em; }
  .minecard b { font-size: 17px; } .minecard .ms { font-size: 14px; color: #5F6670; }
  .todo { background: #FFF8E6; border: 1px solid #F1D39A; border-radius: 14px; padding: 8px 14px; margin: -4px 0 12px; }
  .todo .mh { font-size: 13px; color: #8A5A00; font-weight: 700; margin-bottom: 2px; }
  .todo summary { cursor: pointer; font-size: 15px; font-weight: 700; color: #8A5A00; padding: 2px 0; }
  .todo .urg { margin-left: 8px; font-size: 12px; background: #B42318; color: #fff; border-radius: 999px; padding: 1px 8px; }
  .todo .ti { padding: 6px 0; color: #5A3B00; font-size: 15px; border-top: 1px solid #F5E2BA; }
  .todo .ti.soft { color: #6B6F75; font-size: 14px; }
</style>
</head>
<body>
<div id="gate"><div class="box">
  <div class="spinner" id="spin"></div>
  <div id="msg">確認しています…</div>
  <div id="action"></div>
  <div id="detail"></div>
  <div class="ver" id="ver"></div>
</div></div>

<div id="portal">
  <header><div class="me" id="me"></div><h1>業務ポータル</h1></header>
  <div class="wrap">
    <div id="mine"></div>
    <div id="today"></div>
    <div id="news"></div>
    <div id="tools"></div>
    <button class="pcbtn" id="pcOpen" style="display:none">PCで開く(コードを表示)</button>
    <div class="ver" id="ver2"></div>
  </div>
</div>
<div class="modal" id="pcModal"><div class="panel">
  <div style="font-weight:700;">PCで開くためのコード</div>
  <div class="code" id="pcCode">------</div>
  <div class="sub" id="pcLeft"></div>
  <div class="sub" style="text-align:left;line-height:1.7;">PCのLINE WORKSでポータルのリンクを開き(ブラウザが開きます)、このコードを入力してください。<br>コードは5分間・1回だけ使えます。人に教えないでください。</div>
  <button class="btn" id="pcClose" style="margin-top:16px;">閉じる</button>
</div></div>
<div class="overlay" id="overlay"><div class="spinner"></div><div>開いています…</div></div>

<script>
// ===== 版の番号(どの版のページが表示されているかを、ページの一番下に出す。更新したら書き換える) =====
const PAGE_VERSION = '2026-11-21a';
const T0 = Date.now();
const TIMES = [];
function showVer() {
  const t = 'ver ' + PAGE_VERSION + (TIMES.length ? '・' + TIMES.join('・') : '');
  document.getElementById('ver').textContent = t;
  document.getElementById('ver2').textContent = t;
}
function lap(label, from) { TIMES.push(label + ' ' + ((Date.now() - from) / 1000).toFixed(1) + '秒'); showVer(); }
showVer();

// ===== 設定(秘密情報ではない) =====

const WOFF_ID = 'zOLRGLwYG4i71sA08_geGw';
const AUTH_API = 'https://script.google.com/macros/s/AKfycbyrk69F7F1E1LatE1e0hz_V2p8FVtdx5FxJQTJSDuiMDg7ETCXoLCJc3ZwynbArvSVClA/exec';
// ===== ブラウザの中での受け渡し(同じサイトのツールの画面だけが読める。URLには出さない) =====
//   portal_session：{ token:通行証, exp:期限(ミリ秒), name, apis:{ ツールID: データの入口のURL } }  … ツールの画面が使う
//   portal_data   ：{ at, res }  … ポータルの表示内容。10分以内に戻ってきたら、認証基盤を呼ばずに表示する
const SESSION_KEY = 'portal_session';
const SAVE_KEY = 'portal_data';
const SHOW_CACHE_MS = 10 * 60 * 1000;   // 表示内容(今日の営業など)を使い回す時間
const SESSION_MARGIN_MS = 30 * 60 * 1000; // 通行証の期限が30分を切っていたら、取り直してから開く
function readJson(k) { try { return JSON.parse(sessionStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function sessionOk() { const x = readJson(SESSION_KEY); return !!(x && x.exp - Date.now() > SESSION_MARGIN_MS); }
function saved() { const x = readJson(SAVE_KEY); return x && Date.now() - x.at < SHOW_CACHE_MS && sessionOk() ? x : null; }

// ===== 閉じても消えない場所(localStorage)に、人ごとの表示内容を覚える =====
// スマホの画面を消すとページが閉じることがあるので、開き直したときに一瞬で表示し、裏で本人確認をやり直す
// 人(LINE WORKSのUserId)ごとに覚えるので、共用のスマホで前の人の表示が出ることはない。通行証は含めない。12時間で消す
const VIEW_PREFIX = 'portal_view_';
const VIEW_MAX_MS = 12 * 60 * 60 * 1000;
let PROFILE_ID = '';
let PENDING = null; // 裏で進めている本人確認(カードを押したら、これが終わるのを待つ)
function dayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function saveView(uid, show) {
  if (!uid) return;
  try { localStorage.setItem(VIEW_PREFIX + uid, JSON.stringify({ at: Date.now(), day: dayKey(), res: show })); } catch (e) {}
}
function readView(uid) {
  try {
    const x = JSON.parse(localStorage.getItem(VIEW_PREFIX + uid) || 'null');
    if (!x || !x.res || Date.now() - x.at > VIEW_MAX_MS) return null;
    if (x.day !== dayKey()) x.res.today = []; // 日付が変わっていたら、古い「今日の営業」は出さない
    return x;
  } catch (e) { return null; }
}
function removeView(uid) { try { localStorage.removeItem(VIEW_PREFIX + uid); } catch (e) {} }
function cleanViews() {
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (!k || k.indexOf(VIEW_PREFIX) !== 0) continue;
      const x = JSON.parse(localStorage.getItem(k) || 'null');
      if (!x || Date.now() - x.at > VIEW_MAX_MS) localStorage.removeItem(k);
    }
  } catch (e) {}
}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
function show(text, isErr) {
  $('msg').textContent = text;
  $('msg').className = isErr ? 'err' : '';
  $('spin').style.display = isErr || $('action').innerHTML ? 'none' : 'block';
}
function setAction(html) { $('action').innerHTML = html; $('spin').style.display = html ? 'none' : 'block'; }
function detail(stage, e) { $('detail').textContent = '[' + stage + '] ' + (e && e.message ? e.message : String(e || '')); }

// ===== ツールの直接指定(?tool=…)。WOFFはパラメータを渡さないので通常は使わないが、将来のために残す =====
const KEY = 'entry_request';
function findToolQuery(str) {
  let s = String(str || '');
  for (let i = 0; i < 3; i++) {
    const idx = s.search(/(?:^|[?&#])tool=/);
    if (idx !== -1) {
      const at = s.charAt(idx) === 't' ? idx : idx + 1;
      const begin = Math.max(s.lastIndexOf('?', at), s.lastIndexOf('#', at));
      return new URLSearchParams(s.slice(begin + 1).split('#')[0]);
    }
    let d;
    try { d = decodeURIComponent(s); } catch (e) { break; }
    if (d === s) break;
    s = d;
  }
  return null;
}
function readRequest() {
  const q = findToolQuery(location.search) || findToolQuery(location.hash);
  if (q && q.get('tool')) {
    const params = {};
    q.forEach((v, k) => { if (k !== 'tool') params[k] = v; });
    return { tool: q.get('tool'), params: params };
  }
  return { tool: '', params: {} };
}
const REQUEST = readRequest();

const ERRORS = {
  invalid_token: 'ログインを確認できませんでした。\nLINE WORKSのアプリから開き直してください。',
  not_registered: 'スタッフとして登録されていません。\n利用するには申請が必要です。',
  inactive: '現在、利用できない状態になっています。\n管理者に連絡してください。',
  no_permission: '使える権限がありません。\n必要な場合は管理者に申請してください。',
  no_store_permission: 'この店舗のページを開く権限がありません。',
  unknown_tool: '開こうとしたツールが見つかりません。',
  bad_request: 'うまく確認できませんでした。\nもう一度開き直してください。',
  pair_invalid: 'コードが正しくないか、期限が切れています。\nスマホでもう一度コードを出してください。',
  oauth_state: 'ログインの確認に時間がかかりすぎたか、同じ画面がもう一度使われました。\nもう一度「LINE WORKSでログイン」を押してください。',
  oauth_token: 'LINE WORKSでのログインを確認できませんでした。\nもう一度試すか、スマホのコードで入ってください。',
  oauth_me: 'LINE WORKSから本人の情報を受け取れませんでした。\nもう一度試すか、スマホのコードで入ってください。',
  oauth_off: 'ブラウザでのLINE WORKSログインは、まだ準備中です。\nスマホのコードで入ってください。',
  pair_locked: 'コードの間違いが続いたため、しばらく受け付けを止めています。\n10分ほど待ってから試してください。',
  internal_error: '一時的なエラーが起きました。\n少し待ってから開き直してください。',
};

// ===== 本体 =====
async function start() {
  // ブラウザからのLINE WORKSログインから戻ってきたとき(?code=…&state=…)
  const qs = new URLSearchParams(location.search);
  if (qs.get('code') && qs.get('state')) { await finishOauth(qs.get('code'), qs.get('state')); return; }
  // 10分以内に表示した内容があれば、それですぐ表示し、裏で最新を確かめる(メンテナンスの切り替えなどを取りこぼさない)
  const keep = !REQUEST.tool && saved();
  if (keep) {
    TIMES.push('前回の表示を使用'); showVer(); renderPortal(keep.res, keep.at);
    revalidate(keep.res);
    return;
  }
  if (typeof woff === 'undefined') { show('ログインの部品を読み込めませんでした。\n通信状態を確認して開き直してください。', true); return; }
  try {
    await woff.init({ woffId: WOFF_ID });
  } catch (e) {
    show('LINE WORKSの準備に失敗しました。\n開き直してください。', true);
    detail('init', e);
    return;
  }
  if (!woff.isLoggedIn()) {
    // アプリの外(PC版LINE WORKSから開いたChromeなど)でも、LINE WORKSのログイン画面を経由して本人を確認する
    const inClient = typeof woff.isInClient === 'function' ? woff.isInClient() : null;
    if (inClient === false) { showPairInput(''); return; } // PCのブラウザなど：スマホで出したコードで入る
    let tried = null;
    try { tried = sessionStorage.getItem(KEY + '_login'); } catch (e) {}
    if (!tried) {
      try { sessionStorage.setItem(KEY + '_login', '1'); } catch (e) {}
      show(inClient === false ? 'LINE WORKSのログイン画面に移動します…' : 'LINE WORKSの情報を確認しています…');
      try { woff.login({ redirectUri: location.origin + location.pathname }); } catch (e) { detail('login', e); }
      setTimeout(() => {
        show('もう一度確認します。');
        setAction('<button class="btn" id="cont">続ける</button>');
        $('cont').addEventListener('click', () => woff.login());
      }, 2500);
      return;
    }
    show('LINE WORKSのログインを確認できませんでした。\nトークのリンクから開き直してください。', true);
    setAction('<button class="btn" id="relogin">LINE WORKSでログインし直す</button>');
    $('relogin').addEventListener('click', () => { try { sessionStorage.removeItem(KEY + '_login'); } catch (e) {} location.reload(); });
    try { sessionStorage.removeItem(KEY + '_login'); } catch (e) {}
    return;
  }
  try { sessionStorage.removeItem(KEY + '_login'); } catch (e) {}
  WOFF_READY = true;
  lap('LINE WORKS', T0);
  cleanViews();
  // 閉じたあとに開き直した：この人の表示を覚えていれば一瞬で出し、裏で本人確認と通行証の取り直しをする
  if (!REQUEST.tool) {
    try { PROFILE_ID = (await woff.getProfile()).userId; } catch (e) {}
    const view = PROFILE_ID ? readView(PROFILE_ID) : null;
    if (view) {
      TIMES.push('保存した表示を使用'); showVer();
      renderPortal(view.res, view.at);
      PENDING = refreshFromHub(view.res, true);
      return;
    }
  }
  const res = await callAuth();
  if (!res) return;
  if (res.ok && res.maintenance && res.maintenance.all && !res.maintenance.tester) {
    // ポータル全体のメンテナンス中(確認用の人以外)
    show('ただいまメンテナンス中です。' + (res.maintenance.message ? '\n' + res.maintenance.message : '\nしばらくしてから開き直してください。'), true);
    return;
  }
  if (res.ok && res.items) { renderPortal(res); return; }
  show(ERRORS[res.error] || ERRORS.internal_error, true);
  if (res.error === 'not_registered') {
    // 申請の画面(apply/)に、本人確認に使った情報を引き継ぐ(同じサイトの中だけ。URLには出さない)
    try { sessionStorage.setItem('apply_ctx', JSON.stringify({ token: LAST_LW.token, userId: LAST_LW.userId, api: AUTH_API, at: Date.now() })); } catch (e) {}
    setAction('<a class="btn" href="' + esc(res.applyUrl ? encodeURI(res.applyUrl) : 'apply/') + '">利用を申請する</a>');
  }
}

// 覚えていた内容で表示したあと、通行証を取り直すときに WOFF を準備する(1回だけ)
let WOFF_READY = false;
async function ensureWoff() {
  if (WOFF_READY) return true;
  try {
    await woff.init({ woffId: WOFF_ID });
    WOFF_READY = woff.isLoggedIn();
  } catch (e) { detail('init', e); }
  return WOFF_READY;
}

// 認証基盤に問い合わせる(失敗したら画面にメッセージを出して null を返す)
let LAST_LW = { token: '', userId: '' }; // 申請の画面に引き継ぐ(未登録だったとき)
async function callAuth() {
  let accessToken, profile, r, text, res;
  if (!(await ensureWoff())) {
    show('LINE WORKSのログインを確認できませんでした。\nトークのリンクから開き直してください。', true); return null;
  }
  try {
    accessToken = woff.getAccessToken();
    profile = await woff.getProfile();
    PROFILE_ID = profile.userId;
    LAST_LW = { token: accessToken, userId: profile.userId };
  } catch (e) {
    show('LINE WORKSから情報を受け取れませんでした。\nアプリから開き直してください。', true); detail('profile', e); return null;
  }
  const t2 = Date.now();
  const body = JSON.stringify({ accessToken: accessToken, userId: profile.userId, tool: REQUEST.tool, params: REQUEST.params });
  // GASはまれに一時的なエラーのページを返すので、正しい返事でなければ1回だけやり直す
  for (let attempt = 1; attempt <= 2; attempt++) {
    try {
      r = await fetch(AUTH_API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // application/json だと事前確認の通信が走り、GASが受け付けない
        body: body,
      });
      text = await r.text();
      res = JSON.parse(text);
      break;
    } catch (e) {
      if (attempt === 2) {
        if (text === undefined) { show('通信に失敗しました。\n電波の良いところで開き直してください。', true); detail('fetch', e); }
        else {
          show('認証の仕組みから正しい返事がありませんでした。\n少し待ってから開き直してください。', true);
          detail('response ' + (r ? r.status : '?'), { message: String(text).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 160) });
        }
        return null;
      }
      TIMES.push('やり直し'); text = undefined;
      await new Promise(ok => setTimeout(ok, 800));
    }
  }
  lap('認証', t2);
  // 動作の記録：入口の認証の往復の時間(ツールの画面を開いたときに、まとめて認証基盤へ送られる)
  try { const b = JSON.parse(sessionStorage.getItem('perf_buf') || '[]'); b.push([Date.now(), 'portal', 'portal.auth', Date.now() - t2, res && res.ok ? 'OK' : String(res && res.error || 'NG')]); sessionStorage.setItem('perf_buf', JSON.stringify(b.slice(-60))); } catch (e) {}
  if (res && res.timing) {
    const t = res.timing, sum = Object.keys(t).reduce((a, k) => a + t[k], 0);
    TIMES.push('(内訳 ' + Object.keys(t).map(k => k + (t[k] / 1000).toFixed(1)).join('・') + '・通信と起動' + Math.max(0, (Date.now() - t2 - sum) / 1000).toFixed(1) + ')');
    showVer();
  }
  return res;
}

// 裏で最新を確かめ、変わっていれば表示を差し替える
//   strict：覚えていた表示を出している場合。退職・権限なしなどで拒否されたら、表示を消して理由の画面にする
//   戻り値：取り直せた返事(通行証つき)。通信の失敗などでは null(画面はそのまま。カードを押したときに取り直す)
async function refreshFromHub(old, strict) {
  if (!(await ensureWoff())) return null;
  let res;
  try {
    const accessToken = woff.getAccessToken();
    const profile = await woff.getProfile();
    PROFILE_ID = profile.userId;
    const r = await fetch(AUTH_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accessToken: accessToken, userId: profile.userId, tool: '', params: {} }) });
    res = JSON.parse(await r.text());
  } catch (e) { return null; }
  if (!res) return null;
  const toGate = msg => {
    try { sessionStorage.removeItem(SAVE_KEY); } catch (e) {}
    removeView(PROFILE_ID);
    $('portal').style.display = 'none'; $('gate').style.display = 'flex';
    show(msg, true);
  };
  if (!res.ok) {
    if (strict && res.error !== 'internal_error' && res.error !== 'bad_request') toGate(ERRORS[res.error] || ERRORS.internal_error);
    return null;
  }
  if (res.maintenance && res.maintenance.all && !res.maintenance.tester) {
    toGate('ただいまメンテナンス中です。' + (res.maintenance.message ? '\n' + res.maintenance.message : '')); // メンテナンス中に切り替わっていた
    return null;
  }
  const pick = x => JSON.stringify({ items: (x.items || []).map(i => [i.key, i.maintenance, i.label]), today: x.today, m: x.maintenance });
  renderPortal(res); // 通行証も新しくなる
  if (pick(res) !== pick(old)) { TIMES.push('最新に更新'); showVer(); }
  return res;
}
function revalidate(old) { return refreshFromHub(old, false); }

// ===== ブラウザからのLINE WORKSログイン(OAuth。WOFFを通さない) =====
// 行き：認証基盤から、署名つきの state 入りのログイン画面のURLをもらい、state をこのタブに覚えて移動する
async function startOauth() {
  $('oauthGo').disabled = true; $('oauthErr').textContent = '';
  let res = null;
  try {
    const r = await fetch(AUTH_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'oauth.start', redirectUri: location.origin + location.pathname }) });
    res = JSON.parse(await r.text());
  } catch (e) { res = { ok: false, error: 'internal_error' }; }
  if (!res.ok || !res.url) { $('oauthGo').disabled = false; $('oauthErr').textContent = ERRORS[res.error] || ERRORS.internal_error; return; }
  try { sessionStorage.setItem('oauth_state', res.state); } catch (e) {}
  location.href = res.url;
}
// 帰り：state が行きと同じかを確かめ、認可コードを認証基盤に渡して入る。URLからコードは消す
async function finishOauth(code, state) {
  history.replaceState(null, '', location.pathname); // 認可コードをURL・履歴に残さない
  let mine = '';
  try { mine = sessionStorage.getItem('oauth_state') || ''; sessionStorage.removeItem('oauth_state'); } catch (e) {}
  if (!mine || mine !== state) { showPairInput(ERRORS.oauth_state); return; }
  show('LINE WORKSのログインを確かめています…');
  let res = null;
  try {
    const r = await fetch(AUTH_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'oauth.finish', code: code, state: state, redirectUri: location.origin + location.pathname }) });
    res = JSON.parse(await r.text());
  } catch (e) { res = { ok: false, error: 'internal_error' }; }
  if (res.ok && res.maintenance && res.maintenance.all && !res.maintenance.tester) { show('ただいまメンテナンス中です。' + (res.maintenance.message ? '\n' + res.maintenance.message : ''), true); return; }
  if (!res.ok || !res.items) {
    if (res.error === 'not_registered') { show(ERRORS.not_registered, true); return; }
    showPairInput(ERRORS[res.error] || ERRORS.internal_error);
    if (res.detail) detail('oauth', res.detail);
    return;
  }
  try { sessionStorage.setItem('portal_pc', '1'); } catch (e) {} // アプリの外：表示を端末に長く残さない(PCと同じ扱い)
  PROFILE_ID = res.uid || '';
  renderPortal(res);
}

// ツールのデータの先読み：開ける全店舗の分を1回で受け取り、ブラウザの中に置く(3分間使える)
// ツールの画面は、これがあれば待たずに表示し、裏で最新を確かめる
//   締めチェック → prefetch_closing = { at, inits:{店舗: init} } ／ シフト希望 → prefetch_shift = { at, init }
//   シフト作成(管理者だけ) → prefetch_shiftboard = { at, board } ／ 文書の棚 → prefetch_docs = { at, res } ／ 忘れ物・キャンセル請求 → prefetch_lost・prefetch_invoice = { at, init } ／ お知らせ → prefetch_notice = { at, init:一覧の返事 }
const PREFETCH = { closing: 'closing.prefetch', shift: 'shift.prefetch', shiftboard: 'board.get', calendar: 'cal.get', docs: 'doc.list', lost: 'lost.list', invoice: 'invoice.list', notice: 'notice.list' };
const PREFETCH_APP = { closing: 'closing', shift: 'shift', shiftboard: 'shift', calendar: 'shift', lost: 'tracker', invoice: 'tracker' }; // どのアプリ(API)に送るか
const PREFETCH_APIS = [];
function prefetchTools(items) {
  const sess = readJson(SESSION_KEY);
  if (!sess || !sess.token) return;
  Object.keys(PREFETCH).forEach(tool => {
    const it = items.find(x => x.tool === tool && x.kind !== 'link' && x.api && !x.maintenance);
    if (!it) return;
    const base = String(it.api).split('?')[0];
    if (PREFETCH_APIS.indexOf(base) === -1) PREFETCH_APIS.push(base);
    const key = 'prefetch_' + tool;
    const old = readJson(key);
    if (old && Date.now() - old.at < 60 * 1000) return; // 1分以内に読んだばかりなら読み直さない
    fetch(it.api, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ app: PREFETCH_APP[tool], action: PREFETCH[tool], token: sess.token }),
    }).then(r => r.text()).then(t => {
      const res = JSON.parse(t);
      if (!res || !res.ok) return;
      const v = tool === 'closing' ? { at: Date.now(), inits: res.inits } : tool === 'shiftboard' ? { at: Date.now(), board: res.board }
        : tool === 'calendar' ? { at: Date.now(), cal: res.cal } : tool === 'docs' ? { at: Date.now(), res: res } : tool === 'notice' ? { at: Date.now(), init: res } : { at: Date.now(), init: res.init };
      sessionStorage.setItem(key, JSON.stringify(v));
    }).catch(() => {}); // 先読みの失敗は無視(ツールの画面が自分で取りに行く)
  });
}

// 裏でツールのGAS(データの入口)を起こしておく：?warm=1 で軽く呼ぶだけ(何もしない)
// ツールの画面を開いたときに、GASの起動を待たずに済むようにするため(先読みで呼ぶGASは除く)
function warmTools(items) {
  const bases = PREFETCH_APIS.slice(); // 先読みで呼んだGASは、もう起きている
  items.filter(it => it.kind !== 'link' && it.api).forEach(it => {
    const base = String(it.api).split('?')[0];
    if (bases.indexOf(base) === -1) { bases.push(base); fetch(base + '?warm=1', { mode: 'no-cors', cache: 'no-store' }).catch(() => {}); }
  });
}

    if (nx) {
      const p = nx.date.split('-').map(Number), w = new Date(p[0], p[1] - 1, p[2]).getDay();
      const today = new Date(), isToday = p[1] === today.getMonth() + 1 && p[2] === today.getDate();
      h += '<b>' + (isToday ? '今日 ' : p[1] + '/' + p[2] + '(' + W2.charAt(w) + ') ') + esc(nx.s) + '〜' + esc(nx.e) + '</b> <span class="ms">' + esc(nx.store) + '</span>';
    } else h += '<span class="ms">公開されたシフトはまだありません</span>';
    h += '</div>';
    if (r.today && r.today.length) h += '<div class="mrow"><span class="mh">今日の予定</span><span>' + r.today.map(e => (e.s ? esc(e.s) + ' ' : '') + esc(e.title)).join('<br>') + '</span></div>';
    h += '</div>';
    // やること(シフト希望の未提出・未読のお知らせ)。文字だけ(開くのは下のカードから)
    const todo = [];
    const shiftTool = (items || []).find(it => it.tool === 'shift');
    let urgent = 0;
    if (r.wish && shiftTool) {
      if (r.wish.left <= 7) { urgent++; todo.push('<div class="ti">📝 ' + esc(r.wish.month) + 'のシフト希望がまだです(締め切り ' + esc(r.wish.deadline) + '・あと' + r.wish.left + '日)</div>'); }
      else todo.push('<div class="ti soft">📝 ' + esc(r.wish.month) + 'のシフト希望を出せます(締め切り ' + esc(r.wish.deadline) + ')。締め切りの1週間前までに出してください</div>');
    }
    const noticeTool = (items || []).find(it => it.tool === 'notice');
    const unread = ((res && res.notices) || []).filter(n => !n.read).length;
    if (unread && noticeTool) { urgent++; todo.push('<div class="ti">📢 未読のお知らせが ' + unread + '件あります</div>'); }
    // 最初は閉じておく(押すと開く)。急ぎ(締め切りまで1週間以内・未読)があれば見出しで分かるように
    if (todo.length) h += '<details class="todo"><summary>やること ' + todo.length + '件' + (urgent ? '<span class="urg">急ぎ ' + urgent + '</span>' : '') + '</summary>' + todo.join('') + '</details>';
    $('mine').innerHTML = h;
  };
  try { const c = JSON.parse(sessionStorage.getItem('mine_cache') || 'null'); if (c && Date.now() - c.at < 10 * 60000) { draw(c.r); return; } } catch (e) {}
  let tok = '';
  try { tok = (JSON.parse(sessionStorage.getItem('portal_session') || 'null') || {}).token || ''; } catch (e) {}
  if (!tok) return;
  fetch(cal.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ app: 'shift', action: 'cal.next', token: tok }) })
    .then(x => x.text()).then(t => { const r = JSON.parse(t); try { sessionStorage.setItem('mine_cache', JSON.stringify({ at: Date.now(), r: r })); } catch (e) {} draw(r); })
    .catch(() => {});
}
</script>
</body>
</html>
