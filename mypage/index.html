<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイページ</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="../common/style.css?v=1">
<!--
  マイページ(GitHub Pages の mypage/index.html。2026-11-20)
  自分の情報(氏名・StaffID・雇用区分・所属・グレード・上長・呼び名)を見る。呼び名だけ本人が直せる
  特徴キーワード・メモ・権限などは出さない。データは認証基盤(ツール一覧の mypage の行の API＝認証基盤のURL)
  2026-12-13：社員だけ「有給と稼働」(有給の残り・次の付与・年5日・今月の稼働と残業(予定・実績))。データは Bot(ShiftExtra.gs、app=sx)
-->
<style>
.me-row { display: flex; padding: 9px 0; border-top: 1px solid #EEF0F2; font-size: 16px; }
.me-row:first-of-type { border-top: none; }
.me-row .k { width: 6.5em; color: var(--p-muted); font-size: 14px; flex-shrink: 0; }
.links a { display: block; padding: 12px 4px; border-top: 1px solid #EEF0F2; color: var(--p-ink); text-decoration: none; font-size: 16px; }
.links a:first-child { border-top: none; }
.tdg { font-weight: 700; margin: 14px 0 4px; font-size: 15px; }
.tdr { font-size: 14px; padding: 6px 0; border-top: 1px solid #EEF0F2; }
.lv-big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin: 8px 0; }
.lv-big div { background: #F4F6F5; border-radius: 10px; padding: 8px 4px; }
.lv-big b { display: block; font-size: 24px; } .lv-big span { font-size: 12px; color: var(--p-muted); }
.lv-t { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 6px; }
.lv-t th, .lv-t td { padding: 6px 4px; border-top: 1px solid #EEF0F2; text-align: right; } .lv-t th:first-child, .lv-t td:first-child { text-align: left; color: var(--p-muted); font-weight: 400; }
</style>
</head>
<body>
<div id="app" hidden>
  <div class="p-wrap">
    <div class="p-card" id="info"></div>
    <div class="p-card" id="lv" hidden></div>
    <div class="p-card">
      <h2 style="margin-top:0;">呼び名</h2>
      <div class="p-note">お客様のアンケートなどに出る名前です(名字・ニックネームなど)。空にすると、アンケートには出ません。</div>
      <input class="p-input" id="yobina" maxlength="20" style="margin-top:8px;">
      <div id="msg" style="margin-top:8px;"></div>
      <button class="p-btn p-solid p-big" id="save" style="margin-top:10px;width:100%;">保存する</button>
    </div>
    <div class="p-card" id="td"><h2 style="margin-top:0;">届け出(住所・連絡先・口座)</h2><div class="p-muted">読み込んでいます…</div></div>
    <div class="p-card links" id="links"></div>
    <div class="p-ver" id="ver"></div>
  </div>
</div>
<script src="../common/portal.js?v=1"></script>
<script>
var PAGE_VERSION = '2026-12-13a';
var P = Portal.start({ tool: 'mypage', title: 'マイページ' });
var g = Portal.$, esc = Portal.esc;
function row(k, v) { return '<div class="me-row"><span class="k">' + esc(k) + '</span><span>' + (v ? esc(v) : '<span class="p-muted">―</span>') + '</span></div>'; }
function load() {
  return P.call('me.get', {}, { retry: true }).then(function (r) {
    if (!r.ok) { Portal.gate(r.error === 'AUTH' ? Portal.authMessage(r, 'マイページ') : '開けませんでした：' + r.error, { back: true }); return; }
    var m = r.me;
    g('info').innerHTML = '<h2 style="margin-top:0;">' + esc(m.name) + ' さん</h2>' + row('StaffID', m.sid) + row('雇用区分', m.emp) + row('所属', m.stores) + row('グレード', m.grade) + row('上長', m.bosses);
    g('yobina').value = m['呼び名'] || '';
    // ほかのツールへの近道(ポータルが持っている入口のうち、あるものだけ)
    // 開く先は、ポータルのカードと同じURL(ポータルが portal_urls に入れておく。店舗などの引き継ぎも同じになる)
    var urls = {}; try { urls = JSON.parse(sessionStorage.getItem('portal_urls') || '{}'); } catch (e) {}
    var links = [['calendar', '🗓 シフトカレンダー(自分の予定・全体)'], ['shift', '📝 シフト希望を出す'], ['notice', '📢 お知らせ']]
      .filter(function (x) { return urls[x[0]]; }).map(function (x) { return '<a href="' + esc(urls[x[0]]) + '">' + esc(x[1]) + ' ›</a>'; });
    g('links').innerHTML = links.length ? links.join('') : '<div class="p-muted">―</div>';
    Portal.showApp(); g('ver').textContent = Portal.timing(PAGE_VERSION);
    if (m.emp === '社員') loadLeave();
  }).catch(function (e) { Portal.gate('通信に失敗しました。\n電波の良いところで開き直してください。', { back: true, detail: e.message }); });
}
g('save').addEventListener('click', function () {
  var b = g('save'); b.disabled = true; b.textContent = '保存しています…'; g('msg').innerHTML = '';
  P.call('me.save', { values: { '呼び名': g('yobina').value } }).then(function (r) {
    b.disabled = false; b.textContent = '保存する';
    if (!r.ok) { g('msg').innerHTML = '<div class="p-err">' + esc(r.error === 'AUTH' ? Portal.authMessage(r, 'マイページ') : r.error) + '</div>'; return; }
    g('msg').innerHTML = '<div style="color:var(--p-ok);font-weight:700;">' + (r.unchanged ? '変わったところはありません' : '保存しました(アンケートには1時間ほどで反映されます)') + '</div>';
  }).catch(function () { b.disabled = false; b.textContent = '保存する'; g('msg').innerHTML = '<div class="p-err">通信に失敗しました。もう一度押してください</div>'; });
});

// ===== 有給と稼働(社員だけ。2026-12-13) =====
//   データは Bot(シフトのツールと同じ入口)。ポータルが持っている Bot の入口(シフトカレンダー・シフト希望・シフト作成のどれか)を使う
function botUrl() { var S = Portal.session() || {}, a = S.apis || {}; return a.calendar || a.shift || a.shiftboard || ''; }
function hrs(m) { return (Math.round((m || 0) / 6) / 10).toFixed(1); }
function md(ymd) { var p = String(ymd || '').split('-'); return p.length === 3 ? Number(p[1]) + '/' + Number(p[2]) : ''; }
function loadLeave() {
  var url = botUrl(), S = Portal.session() || {};
  if (!url) return;
  fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ app: 'sx', action: 'leave.mine', token: S.token }) })
    .then(function (r) { return r.text(); }).then(function (t) { return JSON.parse(t); }).then(function (r) {
      if (!r.ok || !r.applicable) return;
      var b = r.balance, h = '<h2 style="margin-top:0;">有給と稼働</h2>';
      if (b.noHire) h += '<div class="p-err">入社日が登録されていないため、有給の日数を数えられません。管理者に伝えてください。</div>';
      h += '<div class="lv-big"><div><b>' + b.left + '</b><span>有給の残り(日)</span></div><div><b>' + (b.next ? b.next.days : '―') + '</b><span>次の付与' + (b.next ? '(' + md(b.next.date) + ')' : '') + '</span></div>' +
        '<div><b>' + (b.yearUsed == null ? '―' : b.yearUsed) + '<small style="font-size:13px;">/5</small></b><span>この1年の取得</span></div></div>';
      if (b.plannedDays) h += '<div class="p-note">これから取る予定の有給 ' + b.plannedDays + '日(引くと残り ' + b.afterPlan + '日)</div>';
      (b.expiring || []).forEach(function (x) { h += '<div class="p-note" style="color:#8A5A00;">⚠ ' + x.days + '日分が ' + md(x.exp) + ' に消えます</div>'; });
      if (b.yearUsed != null && b.yearUsed < 5) h += '<div class="p-note">有給は1年に5日以上取る決まりがあります(' + md(b.yearFrom) + 'からの1年)。</div>';
      h += '<div class="tdg">' + esc(r.month) + 'の稼働</div><table class="lv-t"><tr><th></th><th>予定</th><th>実績</th></tr>' +
        '<tr><td>稼働日</td><td>' + r.plan.days + '日</td><td>' + r.actual.days + '日</td></tr>' +
        '<tr><td>実働</td><td>' + hrs(r.plan.work) + '時間</td><td>' + hrs(r.actual.work) + '時間</td></tr>' +
        '<tr><td>残業</td><td>' + hrs(r.plan.overtime) + '時間</td><td>' + hrs(r.actual.overtime) + '時間</td></tr>' +
        '<tr><td>有給</td><td colspan="2">' + r.plan.leaveDays + '日</td></tr></table>' +
        '<div class="p-note" style="margin-top:6px;">予定＝公開されたシフト、実績＝打刻。残業は1日8時間・週40時間を超えた分。有給の日は実働に入れません。</div>';
      if (r.leaves.length) h += '<div class="tdg">有給の記録(この1年)</div>' + r.leaves.map(function (x) { return '<div class="tdr">' + md(x.date) + '　' + esc(x.kind) + '(' + x.days + '日)</div>'; }).join('');
      g('lv').innerHTML = h; g('lv').hidden = false;
    }).catch(function () {});
}

// ===== 届け出(住所・連絡先・口座。2026-11-24) =====
var TD = null, GROUPS = { address: '住所', tel: '電話', emergency: '緊急連絡先', bank: '振込口座' };
function loadTd() {
  P.call('todoke.mine', {}, { retry: true }).then(function (r) {
    if (!r.ok) { g('td').innerHTML = '<h2 style="margin-top:0;">届け出</h2><div class="p-muted">' + esc(r.error === 'AUTH' ? '使えません' : r.error) + '</div>'; return; }
    TD = r; renderTd(false);
  });
}
function renderTd(editing) {
  var cur = TD.current || {}, h = '<h2 style="margin-top:0;">届け出(住所・連絡先・口座)</h2>';
  var pend = TD.requests.filter(function (x) { return x.state === '申請中'; })[0];
  if (!editing) {
    h += '<div class="p-note">変わったときだけ申請してください(必須ではありません)。見られるのは本人と、承認する担当者だけです。</div>';
    var last = '';
    TD.fields.forEach(function (f) {
      if (f[1] !== last) { h += '<div class="tdg">' + esc(GROUPS[f[1]]) + '</div>'; last = f[1]; }
      h += row(f[0], cur[f[0]] ? (f[0] === '口座番号' ? '****' + String(cur[f[0]]).slice(-3) : cur[f[0]]) : '');
    });
    h += pend ? '<div class="tdr" style="margin-top:10px;"><b>申請中</b>(' + esc(pend.at) + '・' + esc(pend.items) + ') <button class="p-btn" id="tdCancel">取り下げる</button></div>'
      : '<button class="p-btn p-solid p-big" id="tdEdit" style="width:100%;margin-top:12px;">変更を申請する</button>';
    var done = TD.requests.filter(function (x) { return x.state !== '申請中'; }).slice(0, 3);
    if (done.length) h += '<div class="tdg">これまでの申請</div>' + done.map(function (x) { return '<div class="tdr">' + esc(x.at) + '　' + esc(x.state) + '(' + esc(x.items) + ')' + (x.reason ? '<br><span class="p-err">理由：' + esc(x.reason) + '</span>' : '') + '</div>'; }).join('');
  } else {
    h += '<div class="p-note">変える項目だけ入れてください。空の項目は今のままです。</div>';
    var last2 = '';
    TD.fields.forEach(function (f) {
      if (f[1] !== last2) { h += '<div class="tdg">' + esc(GROUPS[f[1]]) + '</div>'; last2 = f[1]; }
      var ph = f[0] === '口座の種別' ? '普通・当座・貯蓄' : f[0] === '口座番号' ? '7けた' : f[0] === '郵便番号' ? '123-4567' : (cur[f[0]] && f[0] !== '口座番号' ? '今：' + cur[f[0]] : '');
      h += '<label class="p-label">' + esc(f[0]) + '</label><input class="p-input" data-td="' + esc(f[0]) + '" placeholder="' + esc(ph) + '">';
    });
    h += '<label class="p-label">メモ(任意)</label><input class="p-input" id="tdMemo" placeholder="例：引っ越しのため">' +
      '<div id="tdMsg"></div><div style="display:flex;gap:8px;margin-top:12px;"><button class="p-btn p-solid p-big" id="tdSend" style="flex:1;">申請する</button><button class="p-btn p-big" id="tdBack" style="flex:1;">やめる</button></div>';
  }
  g('td').innerHTML = h;
  if (g('tdEdit')) g('tdEdit').onclick = function () { renderTd(true); };
  if (g('tdBack')) g('tdBack').onclick = function () { renderTd(false); };
  if (g('tdCancel')) g('tdCancel').onclick = function () {
    if (!confirm('申請を取り下げます。よろしいですか？')) return;
    P.call('todoke.cancel', { id: pend.id }).then(function (r) { if (!r.ok) { alert(r.error); return; } loadTd(); });
  };
  if (g('tdSend')) g('tdSend').onclick = function () {
    var v = {}; Array.prototype.forEach.call(document.querySelectorAll('[data-td]'), function (el) { if (el.value.trim()) v[el.getAttribute('data-td')] = el.value.trim(); });
    var b = g('tdSend'); b.disabled = true; b.textContent = '送っています…'; g('tdMsg').innerHTML = '';
    P.call('todoke.apply', { values: v, memo: g('tdMemo').value }).then(function (r) {
      b.disabled = false; b.textContent = '申請する';
      if (!r.ok) { g('tdMsg').innerHTML = '<div class="p-err" style="margin-top:8px;">' + esc(r.error) + '</div>'; return; }
      alert('申請しました。承認されると、登録情報が変わります。'); loadTd();
    }).catch(function () { b.disabled = false; b.textContent = '申請する'; g('tdMsg').innerHTML = '<div class="p-err">通信に失敗しました。申請できたか、この画面を開き直して確かめてください</div>'; });
  };
}
if (P) { load(); loadTd(); }
</script>
</body>
</html>
