<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>不具合の報告</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="../common/style.css?v=1">
<!--
  不具合の報告(GitHub Pages の bugreport/index.html。2026-12)。ツール一覧の bugreport(全員)・一覧は bugreport_admin
  報告：どの画面・何をしたら・どうなった・急ぎ・画面の写真(1枚・縮めて送る)。端末の情報と画面の版は自動で付く
  一覧(管理者)：状態・担当・メモ。データは認証基盤(ポータル設定のスプシの「不具合報告」シート)
-->
<style>
.rp { background: #fff; border: 1px solid var(--p-line); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
.rp .h { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--p-muted); align-items: center; }
.rp .t { font-size: 15px; margin: 6px 0; white-space: pre-wrap; }
.st { font-size: 12px; padding: 1px 8px; border-radius: 999px; font-weight: 700; background: #EEF0F2; }
.st.s0 { background: #FDECEA; color: #B42318; } .st.s1 { background: #FFF6E5; color: #8A5A00; } .st.s2 { background: #E3F4E8; color: #1F7A3D; }
.ed { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
.ed select, .ed input, .ed textarea { font-size: 14px; padding: 6px; border: 1px solid #B9C0C8; border-radius: 8px; font-family: inherit; }
.ed textarea { grid-column: 1 / -1; min-height: 40px; }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; } .tabs button { padding: 8px 14px; border: 1px solid #B9C0C8; border-radius: 999px; background: #fff; cursor: pointer; font-family: inherit; font-size: 15px; }
.tabs button.on { background: var(--p-c); color: #fff; border-color: var(--p-c); }
</style>
</head>
<body>
<div id="app" hidden>
  <div class="p-wrap">
    <div class="tabs" id="tabs" style="display:none;"><button class="on" data-v="form">報告する</button><button data-v="list">報告の一覧(管理)</button></div>
    <div id="vForm">
      <div class="p-card">
        <h2 style="margin-top:0;">不具合を報告する</h2>
        <div class="p-note">うまく動かない・おかしい表示・分かりにくい、など何でも。小さなことでも助かります。</div>
        <label class="p-label">どの画面ですか</label>
        <select class="p-select" id="screen"><option>ポータル(最初の画面)</option><option>シフト希望</option><option>シフトカレンダー</option><option>シフト作成</option><option>締めチェック</option><option>お知らせ</option><option>書類(給与明細)</option><option>マイページ</option><option>打刻の端末</option><option>お客様アンケート</option><option>ログイン</option><option>その他</option></select>
        <label class="p-label">何をしたら</label><textarea class="p-textarea" id="what" rows="3" placeholder="例：シフト希望で「提出する」を押したら"></textarea>
        <label class="p-label">どうなった(必須)</label><textarea class="p-textarea" id="result" rows="3" placeholder="例：「通信に失敗しました」と出て、提出できなかった"></textarea>
        <label style="display:block;margin-top:10px;"><input type="checkbox" id="urgent"> 急ぎ(仕事が止まっている)</label>
        <label class="p-label">画面の写真(スクリーンショット。あれば)</label><input type="file" id="photo" accept="image/*"><div id="pv"></div>
        <div id="msg" style="margin-top:8px;"></div>
        <button class="p-btn p-solid p-big" id="send" style="width:100%;margin-top:12px;">報告する</button>
      </div>
      <div class="p-card"><h2 style="margin-top:0;">自分の報告</h2><div id="mine" class="p-muted">読み込んでいます…</div></div>
    </div>
    <div id="vList" style="display:none;"></div>
    <div class="p-ver" id="ver"></div>
  </div>
</div>
<script src="../common/portal.js?v=1"></script>
<script>
var PAGE_VERSION = '2026-12-06a';
var P = Portal.start({ tool: 'bugreport', title: '不具合の報告' });
var g = Portal.$, esc = Portal.esc, PHOTO = '', LIST = null, F = 'open';
var S = Portal.session() || {}, ADMIN = !!(S.apis && S.apis.bugreport_admin);
function adminCall(a, x) { return fetch(S.apis.bugreport_admin, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: a, token: S.token }, x || {})) }).then(function (r) { return r.text(); }).then(function (t) { return JSON.parse(t); }); }

function loadMine() {
  P.call('bug.mine', {}, { retry: true }).then(function (r) {
    if (!r.ok) { g('mine').textContent = r.error; return; }
    g('mine').innerHTML = r.rows.length ? r.rows.map(function (x) { return '<div class="rp"><div class="h"><span class="st">' + esc(x.state) + '</span><span>' + esc(x.at) + '</span><span>' + esc(x.screen) + '</span></div><div class="t">' + esc(x.result) + '</div></div>'; }).join('') : 'まだありません';
  });
}
// 写真は縮めて JPEG にする(送る量を減らす)
g('photo').addEventListener('change', function () {
  var f = g('photo').files[0]; PHOTO = ''; g('pv').innerHTML = '';
  if (!f) return;
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    var d = c.toDataURL('image/jpeg', 0.8); PHOTO = d.split(',')[1];
    g('pv').innerHTML = '<img src="' + d + '" style="max-width:160px;border-radius:8px;margin-top:6px;">';
  };
  img.src = url;
});
g('send').addEventListener('click', function () {
  if (!g('result').value.trim()) { g('msg').innerHTML = '<div class="p-err">「どうなった」を書いてください</div>'; return; }
  var b = g('send'); b.disabled = true; b.textContent = '送っています…'; g('msg').innerHTML = '';
  P.call('bug.submit', { screen: g('screen').value, what: g('what').value, result: g('result').value, urgent: g('urgent').checked, photo: PHOTO, ua: navigator.userAgent, ver: (document.referrer || '').replace(location.origin, '').slice(0, 60) }).then(function (r) {
    b.disabled = false; b.textContent = '報告する';
    if (!r.ok) { g('msg').innerHTML = '<div class="p-err">' + esc(r.error) + '</div>'; return; }
    g('msg').innerHTML = '<div style="color:var(--p-ok);font-weight:700;">報告しました。ありがとうございます。</div>';
    g('what').value = ''; g('result').value = ''; g('urgent').checked = false; g('photo').value = ''; PHOTO = ''; g('pv').innerHTML = '';
    loadMine();
  }).catch(function () { b.disabled = false; b.textContent = '報告する'; g('msg').innerHTML = '<div class="p-err">通信に失敗しました。もう一度押してください</div>'; });
});

// ===== 一覧(管理) =====
function loadList() {
  g('vList').innerHTML = '<div class="p-card p-muted">読み込んでいます…</div>';
  adminCall('bug.list').then(function (r) { if (!r.ok) { g('vList').innerHTML = '<div class="p-card p-err">' + esc(r.error) + '</div>'; return; } LIST = r; renderList(); });
}
function renderList() {
  var rows = LIST.rows.filter(function (x) { return F === 'all' || (F === 'open' ? (x.state === '未対応' || x.state === '調べ中') : x.state === F); });
  var opt = function (v, l, cur) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>'; };
  g('vList').innerHTML = '<div style="margin-bottom:8px;"><select id="fState" class="p-select" style="width:auto;">' + opt('open', '未対応・調べ中', F) + LIST.states.map(function (s) { return opt(s, s, F); }).join('') + opt('all', 'すべて', F) + '</select> <span class="p-muted">' + rows.length + '件</span></div>' +
    (rows.length ? rows.map(function (x) {
      var si = LIST.states.indexOf(x.state);
      return '<div class="rp" data-id="' + esc(x.id) + '"><div class="h"><span class="st s' + si + '">' + esc(x.state) + '</span>' + (x.urgent ? '<span class="st s0">急ぎ</span>' : '') + '<span>' + esc(x.at) + '</span><span>' + esc(x.name) + '</span><span>' + esc(x.screen) + '</span>' + (x.updated ? '<span>更新 ' + esc(x.updated) + '(' + esc(x.by) + ')</span>' : '') + '</div>' +
        (x.what ? '<div class="t"><b>したこと：</b>' + esc(x.what) + '</div>' : '') + '<div class="t"><b>どうなった：</b>' + esc(x.result) + '</div>' +
        (x.photo ? '<div><a href="' + esc(x.photo) + '" target="_blank" rel="noopener">画面の写真(ドライブ)</a></div>' : '') + '<div class="p-note">' + esc(x.ua) + '</div>' +
        '<div class="ed"><select data-k="state">' + LIST.states.map(function (s) { return opt(s, s, x.state); }).join('') + '</select><input data-k="owner" placeholder="担当" value="' + esc(x.owner) + '"><textarea data-k="memo" placeholder="メモ(原因・直したこと)">' + esc(x.memo) + '</textarea></div>' +
        '<button class="p-btn" data-save style="margin-top:6px;">保存</button> <span class="m"></span></div>';
    }).join('') : '<div class="p-card p-muted">該当する報告はありません</div>');
  g('fState').onchange = function () { F = this.value; renderList(); };
}
g('vList').addEventListener('click', function (e) {
  var b = e.target.closest('[data-save]'); if (!b) return;
  var box = b.closest('.rp'), id = box.getAttribute('data-id'), x = LIST.rows.filter(function (r) { return r.id === id; })[0];
  var val = function (k) { return box.querySelector('[data-k="' + k + '"]').value; };
  b.disabled = true;
  adminCall('bug.update', { id: id, state: val('state'), owner: val('owner'), memo: val('memo'), ver: [x.state, x.owner, x.memo].join('|') }).then(function (r) {
    b.disabled = false;
    if (!r.ok) { box.querySelector('.m').textContent = r.error; return; }
    x.state = val('state'); x.owner = val('owner'); x.memo = val('memo'); box.querySelector('.m').textContent = '保存しました';
  });
});
g('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  Array.prototype.forEach.call(g('tabs').children, function (x) { x.classList.toggle('on', x === b); });
  var list = b.getAttribute('data-v') === 'list';
  g('vForm').style.display = list ? 'none' : ''; g('vList').style.display = list ? '' : 'none';
  if (list && !LIST) loadList();
});
if (P) {
  // ほかの画面から「不具合を報告」で来たときは、その画面の名前を入れておく
  var m = location.search.match(/[?&]screen=([^&]+)/);
  if (m) { var sc = decodeURIComponent(m[1]); var o = Array.prototype.filter.call(g('screen').options, function (x) { return sc.indexOf(x.value.replace(/\(.*$/, '')) !== -1; })[0]; if (o) g('screen').value = o.value; }
  if (ADMIN) g('tabs').style.display = 'flex';
  Portal.showApp(); g('ver').textContent = Portal.timing(PAGE_VERSION);
  loadMine();
}
</script>
</body>
</html>
